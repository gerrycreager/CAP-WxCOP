<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station Lookup - CAP WxCOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .home-button {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .home-button:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
        
        .search-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .search-form {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .form-group input {
            padding: 0.8rem;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            width: 150px;
            backdrop-filter: blur(5px);
        }
        
        .form-group input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.15);
        }
        
        .search-button {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 0.8rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            margin-top: 1.5rem;
        }
        
        .search-button:hover:not(:disabled) {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
        
        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results-section {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 2rem;
            display: none;
        }
        
        .station-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .station-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .station-details {
            color: #666;
            font-size: 1rem;
        }
        
        .metar-section {
            margin-bottom: 2rem;
        }
        
        .section-title {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
            padding-left: 1rem;
        }
        
        .metar-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #28a745;
        }
        
        .metar-item.speci {
            border-left-color: #ffc107;
        }
        
        .metar-time {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }
        
        .metar-decoded {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .weather-param {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }
        
        .param-label {
            font-weight: 600;
            color: #495057;
        }
        
        .param-value {
            color: #212529;
            font-family: 'Courier New', monospace;
        }
        
        .sky-conditions {
            background: #e3f2fd;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid #bbdefb;
        }
        
        .sky-title {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 0.5rem;
        }
        
        .cloud-layer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0;
            border-bottom: 1px solid #bbdefb;
        }
        
        .cloud-layer:last-child {
            border-bottom: none;
        }
        
        .cloud-cover {
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .cloud-cover.FEW { background: #d4edda; color: #155724; }
        .cloud-cover.SCT { background: #fff3cd; color: #856404; }
        .cloud-cover.BKN { background: #f8d7da; color: #721c24; }
        .cloud-cover.OVC { background: #d1ecf1; color: #0c5460; }
        
        .cloud-height {
            font-family: 'Courier New', monospace;
            color: #495057;
        }
        
        .metar-raw {
            background: #f1f3f4;
            border-radius: 4px;
            padding: 1rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #495057;
            border: 1px solid #dee2e6;
        }
        
        .flight-category {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        
        .flight-category.VFR { background: #d4edda; color: #155724; }
        .flight-category.MVFR { background: #fff3cd; color: #856404; }
        .flight-category.IFR { background: #f8d7da; color: #721c24; }
        .flight-category.LIFR { background: #d1ecf1; color: #0c5460; }
        
        .taf-section {
            margin-top: 2rem;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
        }
        
        .taf-raw {
            background: white;
            border-radius: 4px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #495057;
            border: 1px solid #dee2e6;
            white-space: pre-wrap;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
        }
        
        .weather-present {
            background: #fff3cd;
            border-radius: 4px;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: 1px solid #ffeaa7;
        }
        
        .present-weather-title {
            font-weight: 600;
            color: #856404;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }
        
        .present-weather-items {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .weather-item {
            background: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            border: 1px solid #ffd32a;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #856404;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .home-button {
                position: relative;
                top: auto;
                left: auto;
                margin-bottom: 1rem;
                display: inline-block;
            }
            
            .search-form {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-group input {
                width: 100%;
            }
            
            .metar-decoded {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
#    <a href="/CAP_WxCOP/" class="home-button">🏠 Home</a>
    <a href="/" class="home-button">🏠 Home</a>
    
    <div class="container">
        <div class="header">
            <h1>🛩️ Weather Station Lookup</h1>
            <p>METAR observations and TAF forecasts</p>
        </div>
        
        <div class="search-section">
            <div class="search-form">
                <div class="form-group">
                    <label for="stationId">Station ID</label>
                    <input type="text" id="stationId" placeholder="KORD" maxlength="4">
                </div>
                <button class="search-button" onclick="searchStation()">Get Weather Data</button>
            </div>
        </div>
        
        <div id="results" class="results-section">
            <div id="loading" class="loading" style="display: none;">
                <p>Loading weather data...</p>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            
            <div id="stationData" style="display: none;">
                <div class="station-header">
                    <div class="station-title" id="stationTitle"></div>
                    <div class="station-details" id="stationDetails"></div>
                </div>
                
                <div class="metar-section">
                    <h2 class="section-title">Recent METAR Observations</h2>
                    <div id="metarList"></div>
                </div>
                
                <div id="tafSection" class="taf-section" style="display: none;">
                    <h2 class="section-title">Terminal Aerodrome Forecast (TAF)</h2>
                    <div class="taf-raw" id="tafData"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentStationData = null;
        
        // Handle Enter key in station input
        document.getElementById('stationId').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchStation();
            }
        });
        
        // Load station from URL parameter
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const station = urlParams.get('station');
            if (station) {
                document.getElementById('stationId').value = station.toUpperCase();
                searchStation();
            }
        });
        
        async function searchStation() {
            const stationId = document.getElementById('stationId').value.trim().toUpperCase();
            
            if (!stationId || stationId.length !== 4) {
                showError('Please enter a valid 4-character station ID (e.g., KORD)');
                return;
            }
            
            // Show loading state
            document.getElementById('results').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('stationData').style.display = 'none';
            
            try {
                // Fetch station data from correct API endpoint
                const response = await fetch(`/CAP_WxCOP/api/weather/station/${stationId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                currentStationData = data;
                
                // Hide loading, show data
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stationData').style.display = 'block';
                
                // Populate station info
                displayStationInfo(data.station);
                
                // Display METARs
                displayMetars(data.metars);
                
                // Display TAF if available
                if (data.taf) {
                    displayTaf(data.taf);
                }
                
                // Update URL
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('station', stationId);
                window.history.replaceState({}, '', newUrl);
                
            } catch (error) {
                console.error('Error fetching station data:', error);
                document.getElementById('loading').style.display = 'none';
                showError(`Error loading data: ${error.message}`);
            }
        }
        
        function displayStationInfo(station) {
            const title = document.getElementById('stationTitle');
            const details = document.getElementById('stationDetails');
            
            title.textContent = `${station.station_id} - ${station.airport_name || 'Unknown Airport'}`;
            
            const detailsText = [
                station.municipality ? `${station.municipality}` : '',
                station.elevation_ft ? `${station.elevation_ft} ft` : '',
                station.is_military ? 'Military' : '',
                `${station.latitude?.toFixed(4) || 'Unknown'}, ${station.longitude?.toFixed(4) || 'Unknown'}`
            ].filter(Boolean).join(' • ');
            
            details.textContent = detailsText;
        }
        
        function displayMetars(metars) {
            const container = document.getElementById('metarList');
            container.innerHTML = '';
            
            if (!metars || metars.length === 0) {
                container.innerHTML = '<p>No recent METAR data available</p>';
                return;
            }
            
            metars.forEach(metar => {
                const metarDiv = document.createElement('div');
                metarDiv.className = `metar-item ${metar.is_speci ? 'speci' : ''}`;
                
                const time = new Date(metar.observation_time);
                const pad = n => String(n).padStart(2,'0');
                const timeStr = time.toLocaleString('en-US', {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric',
                    timeZone: 'UTC'
                }) + ', ' + pad(time.getUTCHours()) + pad(time.getUTCMinutes()) + 'Z';
                
                metarDiv.innerHTML = `
                    <div class="metar-time">
                        ${timeStr} ${metar.is_speci ? '(SPECI)' : ''}
                        <span class="flight-category ${metar.flight_category || 'VFR'}">${metar.flight_category || 'VFR'}</span>
                    </div>
                    
                    <div class="metar-decoded">
                        ${createWeatherParam('Temperature', formatTemp(metar.temp_c))}
                        ${createWeatherParam('Dewpoint', formatTemp(metar.dewpoint_c))}
                        ${createWeatherParam('Wind', formatWind(metar.wind_dir, metar.wind_speed_kts, metar.wind_gust_kts))}
                        ${createWeatherParam('Altimeter', formatAltimeter(metar.altimeter_hg))}
                        ${createWeatherParam('Visibility', formatVisibility(metar.visibility_sm))}
                    </div>
                    
                    ${formatSkyConditions(metar.sky_conditions)}
                    ${formatPresentWeather(metar.present_weather)}
                    
                    <div class="metar-raw">${metar.raw_text}</div>
                `;
                
                container.appendChild(metarDiv);
            });
        }
        
        function formatSkyConditions(skyConditions) {
            if (!skyConditions || skyConditions.length === 0) {
                return '<div class="sky-conditions"><div class="sky-title">Sky Conditions</div><div>Clear skies</div></div>';
            }
            
            let html = '<div class="sky-conditions"><div class="sky-title">Sky Conditions</div>';
            
            skyConditions.forEach(layer => {
                const cover = layer.cover || 'UNK';
                const height = layer.height_ft ? `${layer.height_ft.toLocaleString()} ft` : 'Unknown height';
                
                html += `
                    <div class="cloud-layer">
                        <span class="cloud-cover ${cover}">${cover}</span>
                        <span class="cloud-height">${height}</span>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }
        
        function formatPresentWeather(presentWeather) {
            if (!presentWeather || presentWeather.length === 0) {
                return '';
            }
            
            let html = '<div class="weather-present"><div class="present-weather-title">Present Weather</div><div class="present-weather-items">';
            
            presentWeather.forEach(weather => {
                if (typeof weather === 'string') {
                    html += `<span class="weather-item">${weather}</span>`;
                } else if (Array.isArray(weather)) {
                    const weatherStr = weather.filter(w => w !== null && w !== undefined).join('');
                    if (weatherStr) {
                        html += `<span class="weather-item">${weatherStr}</span>`;
                    }
                }
            });
            
            html += '</div></div>';
            return html;
        }
        
        function createWeatherParam(label, value) {
            return `
                <div class="weather-param">
                    <span class="param-label">${label}:</span>
                    <span class="param-value">${value || 'N/A'}</span>
                </div>
            `;
        }
        
        function formatTemp(tempC) {
            if (tempC === null || tempC === undefined) return 'N/A';
            const tempF = (tempC * 9/5) + 32;
            return `${tempC}°C (${tempF.toFixed(0)}°F)`;
        }
        
        function formatWind(dir, speed, gust) {
            if (!speed && speed !== 0) return 'Calm';
            
            let wind = '';
            if (dir) wind += `${dir}°`;
            if (speed || speed === 0) wind += ` ${speed} kt`;
            if (gust) wind += ` G${gust}`;
            
            return wind || 'N/A';
        }
        
        function formatAltimeter(altHg) {
            if (altHg === null || altHg === undefined) return 'N/A';
            return `${altHg.toFixed(2)} inHg`;
        }
        
        function formatVisibility(visSm) {
            if (visSm === null || visSm === undefined) return 'N/A';
            return `${visSm} SM`;
        }
        
        function displayTaf(taf) {
            const section = document.getElementById('tafSection');
            const data = document.getElementById('tafData');
            
            const issueTime = new Date(taf.issue_time);
            const validFrom = new Date(taf.valid_from);
            const validTo = new Date(taf.valid_to);
            
            const fmtUTC = dt => dt.toLocaleString('en-US', {
                weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC'
            }) + ', ' + String(dt.getUTCHours()).padStart(2,'0') +
                String(dt.getUTCMinutes()).padStart(2,'0') + 'Z';
            const header = `Issued: ${fmtUTC(issueTime)}
Valid: ${fmtUTC(validFrom)} - ${fmtUTC(validTo)}

${taf.raw_text}`;
            
            data.textContent = header;
            section.style.display = 'block';
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
