<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station Detail</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .btn-home {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-home:hover {
            background: rgba(255,255,255,0.3);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
        }
        h2 {
            color: #4a9eff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .search-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .search-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        label {
            color: #b0b0b0;
            font-size: 14px;
        }
        input[type="text"] {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-transform: uppercase;
            width: 120px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4a9eff;
        }
        input[type="radio"] {
            margin-right: 5px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
        }
        button {
            padding: 8px 20px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        button:hover {
            background: #3a8eef;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #4a9eff;
        }
        .error {
            background: #4a1a1a;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .station-block {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        .station-id {
            font-size: 20px;
            font-weight: bold;
            color: #4a9eff;
        }
        .station-distance {
            color: #888;
            font-size: 14px;
        }
        .observation {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #444;
        }
        .observation.metar { border-left-color: #4a9eff; }
        .observation.speci { border-left-color: #ff9f40; }
        .obs-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .obs-type {
            font-weight: bold;
            font-size: 14px;
        }
        .obs-type.metar { color: #4a9eff; }
        .obs-type.speci { color: #ff9f40; }
        .obs-time {
            color: #888;
            font-size: 13px;
        }
        .obs-text {
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
            word-wrap: break-word;
        }
        .obs-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        .data-item {
            font-size: 12px;
        }
        .data-label {
            color: #888;
            margin-right: 5px;
        }
        .data-value {
            color: #e0e0e0;
            font-weight: bold;
        }
        .flight-category {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }
        .cat-VFR { background: #00AA00; color: white; }
        .cat-MVFR { background: #FFD700; color: black; }
        .cat-IFR { background: #FF0000; color: white; }
        .cat-LIFR { background: #FF00FF; color: white; }
        .context-section {
            margin-top: 10px;
            padding: 10px;
            background: #252525;
            border-radius: 4px;
        }
        .context-header {
            color: #ff9f40;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .context-obs {
            font-size: 11px;
            padding: 5px;
            margin-bottom: 5px;
            background: #1a1a1a;
            border-radius: 3px;
        }
        .context-obs-header {
            color: #888;
            margin-bottom: 3px;
        }
        .taf-section {
            margin-top: 15px;
            padding: 15px;
            background: #1a4a1a;
            border-radius: 4px;
            border-left: 4px solid #00AA00;
        }
        .taf-header {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .taf-text {
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
        }
        .taf-validity {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌤️ Weather Station Detail</h1>
        <a href="/" class="btn-home">
            <span>🏠</span>
            <span>Home</span>
        </a>
    </div>
    
    <div class="container">
        <div class="search-panel">
            <div class="search-row">
                <div>
                    <label>Station ID:</label>
                    <input type="text" id="stationInput" placeholder="KCOS" maxlength="4">
                </div>
                
                <div class="radio-group">
                    <label>
                        <input type="radio" name="radius" value="0" checked> Single Station
                    </label>
                    <label>
                        <input type="radio" name="radius" value="50"> Within 50nm
                    </label>
                </div>
                
                <button onclick="searchStation()">Get Weather</button>
            </div>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        function searchStation() {
            const stationId = document.getElementById('stationInput').value.trim().toUpperCase();
            const radius = document.querySelector('input[name="radius"]:checked').value;
            
            if (!stationId || stationId.length < 3) {
                alert('Please enter a valid station ID (e.g., KCOS)');
                return;
            }
            
            const results = document.getElementById('results');
            results.innerHTML = '<div class="loading">Loading weather data...</div>';
            
            const url = `/cap_winds_app/weather/api/station/${stationId}?radius=${radius}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        results.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                        return;
                    }
                    displayResults(data);
                })
                .catch(error => {
                    results.innerHTML = `<div class="error">Error loading data: ${error}</div>`;
                });
        }
        
        function displayResults(data) {
            const results = document.getElementById('results');
            let html = '';
            
            for (const station of data.stations) {
                html += `<div class="station-block">`;
                html += `<div class="station-header">`;
                html += `<span class="station-id">${station.station_id}</span>`;
                if (station.distance_nm > 0) {
                    html += `<span class="station-distance">${station.distance_nm} nm</span>`;
                }
                html += `</div>`;
                
                // Display observations
                for (const obs of station.observations) {
                    const obsType = obs.type.toLowerCase();
                    html += `<div class="observation ${obsType}">`;
                    html += `<div class="obs-header">`;
                    html += `<span class="obs-type ${obsType}">${obs.type}</span>`;
                    html += `<span class="obs-time">${formatTime(obs.observation_time)}</span>`;
                    html += `</div>`;
                    html += `<div class="obs-text">${obs.raw_text}</div>`;
                    
                    // Display parsed data
                    html += `<div class="obs-data">`;
                    html += `<div class="data-item"><span class="data-label">Category:</span>`;
                    html += `<span class="flight-category cat-${obs.flight_category}">${obs.flight_category}</span></div>`;
                    
                    if (obs.temp_c !== null) {
                        html += `<div class="data-item"><span class="data-label">Temp:</span><span class="data-value">${Math.round(obs.temp_c)}°C</span></div>`;
                    }
                    if (obs.dewpoint_c !== null) {
                        html += `<div class="data-item"><span class="data-label">Dewpoint:</span><span class="data-value">${Math.round(obs.dewpoint_c)}°C</span></div>`;
                    }
                    if (obs.wind_speed_kts !== null) {
                        const windDir = obs.wind_dir !== null ? obs.wind_dir.toString().padStart(3, '0') : 'VRB';
                        const windGust = obs.wind_gust_kts !== null ? `G${obs.wind_gust_kts}` : '';
                        html += `<div class="data-item"><span class="data-label">Wind:</span><span class="data-value">${windDir}/${obs.wind_speed_kts}${windGust} KT</span></div>`;
                    }
                    if (obs.visibility_sm !== null) {
                        html += `<div class="data-item"><span class="data-label">Vis:</span><span class="data-value">${obs.visibility_sm} SM</span></div>`;
                    }
                    if (obs.altimeter_hg !== null) {
                        html += `<div class="data-item"><span class="data-label">Altimeter:</span><span class="data-value">${obs.altimeter_hg.toFixed(2)}" Hg</span></div>`;
                    }
                    html += `</div>`;
                    
                    // Display context for SPECIs
                    if (obs.context && obs.context.length > 0) {
                        html += `<div class="context-section">`;
                        html += `<div class="context-header">⚠️ SPECI Context (Weather Trend):</div>`;
                        for (const ctx of obs.context) {
                            html += `<div class="context-obs">`;
                            html += `<div class="context-obs-header">${ctx.type} @ ${formatTime(ctx.time)} - `;
                            html += `<span class="flight-category cat-${ctx.flight_category}">${ctx.flight_category}</span></div>`;
                            html += `<div style="font-size: 10px; color: #b0b0b0;">${ctx.raw_text}</div>`;
                            html += `</div>`;
                        }
                        html += `</div>`;
                    }
                    
                    html += `</div>`;
                }
                
                // Display TAF if available
                if (station.taf) {
                    html += `<div class="taf-section">`;
                    html += `<div class="taf-header">TAF FORECAST</div>`;
                    html += `<div class="taf-text">${station.taf.raw_text}</div>`;
                    
                    // Add decoded TAF if available
                    if (station.taf.decoded_html) {
                        html += `<div style="margin-top: 15px; padding: 10px; background: #143a14; border-radius: 4px; font-size: 12px; line-height: 1.3;">`;
                        html += `<div style="color: #00ff00; font-weight: bold; margin-bottom: 8px;">Decoded Forecast:</div>`;
                        html += station.taf.decoded_html;
                        html += `</div>`;
                    }
                    
                    html += `<div class="taf-validity">Valid: ${formatTime(station.taf.valid_from)} to ${formatTime(station.taf.valid_to)}</div>`;
                    html += `</div>`;
                }
                
                // Display runway analysis if available
                if (station.runway_analysis_html) {
                    html += `<div style="background: #1a2a3a; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #4a9eff;">`;
                    html += `<div style="color: #4a9eff; font-weight: bold; margin-bottom: 10px; font-size: 14px;">✈️ RUNWAY ANALYSIS</div>`;
                    html += `<div style="font-size: 12px; line-height: 1.4;">`;
                    html += station.runway_analysis_html;
                    html += `</div></div>`;
                }
                
                html += `</div>`;
            }
            
            results.innerHTML = html;
        }
        
        function formatTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            const day = date.getUTCDate().toString().padStart(2, '0');
            const hours = date.getUTCHours().toString().padStart(2, '0');
            const minutes = date.getUTCMinutes().toString().padStart(2, '0');
            return `${day}${hours}${minutes}Z`;
        }
        
        // Allow Enter key to search
        document.getElementById('stationInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchStation();
            }
        });
    </script>
</body>
</html>
