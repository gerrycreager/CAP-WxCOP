<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAP WxCOP Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo h1 {
            color: #e94560;
            font-size: 1.4rem;
            margin: 0;
            letter-spacing: 0.05em;
        }
        .logo p {
            color: #888;
            font-size: 0.85rem;
            margin: 0.25rem 0 0;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 0.35rem;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background: #0f3460;
            border: 1px solid #1a4a8a;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #e94560;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.7rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { background: #c73652; }
        .alert {
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .alert-error   { background: #3d1a1a; border: 1px solid #e94560; color: #ff8080; }
        .alert-info    { background: #1a2d3d; border: 1px solid #4a9eca; color: #80c8ff; }
        .alert-success { background: #1a3d1a; border: 1px solid #4aab4a; color: #80e080; }
        .restricted {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <h1>CAP WxCOP</h1>
        <p>KQ Station Administration</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit">Continue →</button>
    </form>

    <p class="restricted">
        Access restricted to authorized CAP Weather Team personnel.
    </p>
</div>
</body>
</html>
