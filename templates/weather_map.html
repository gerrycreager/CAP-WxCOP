<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"="width=device-width, initial-scale=1.0">
    <title>Weather Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100vw;
            height: calc(100vh - 48px);
            margin-top: 48px;
        }
        .leaflet-popup-content {
            font-family: 'Courier New', monospace;
            min-width: 350px;
            max-width: 500px;
        }
        .popup-header {
            font-size: 18px;
            font-weight: bold;
            color: #2a5caa;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ccc;
        }
        .popup-section {
            margin-bottom: 12px;
        }
        .popup-label {
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .popup-text {
            font-size: 12px;
            line-height: 1.5;
            color: #1a1a1a;
            white-space: pre-wrap;
        }
        .popup-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .popup-data-item {
            font-size: 11px;
        }
        .popup-data-label {
            color: #666;
        }
        .popup-data-value {
            color: #1a1a1a;
            font-weight: bold;
        }
        .flight-category {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }
        .cat-VFR { background: #00AA00; color: white; }
        .cat-MVFR { background: #FFD700; color: black; }
        .cat-IFR { background: #FF0000; color: white; }
        .cat-LIFR { background: #FF00FF; color: white; }
        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .control-title {
            font-size: 14px;
            color: #4a9eff;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .filter-group {
            margin-bottom: 10px;
        }
        .filter-label {
            font-size: 11px;
            color: #b0b0b0;
            display: block;
            margin-bottom: 5px;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .checkbox-label {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        input[type="checkbox"] {
            margin: 0;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
        }
        button:hover {
            background: #3a8eef;
        }
        .legend {
            position: absolute;
            bottom: 30px;
            right: 10px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .legend-title {
            font-size: 12px;
            color: #4a9eff;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-size: 11px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #000;
        }
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2a2a2a;
            padding: 20px 40px;
            border-radius: 8px;
            z-index: 2000;
            color: #4a9eff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <div style="
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 12px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10000;
    ">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="color: white; text-decoration: none; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 22px;">🛩️</span>
                <span>CAP Weather Hub</span>
            </a>
            <nav style="display: flex; gap: 12px;">
                <a href="/" style="color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; background: rgba(255,255,255,0.2); font-weight: 500;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">🏠 Home</a>
            </nav>
        </div>
    </div>
    
    <div id="map"></div>
    
    <div class="control-panel">
        <div class="control-title">Map Controls</div>
        <div class="filter-group">
            <span class="filter-label">Flight Categories:</span>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="showVFR" checked> VFR
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="showMVFR" checked> MVFR
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="showIFR" checked> IFR
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="showLIFR" checked> LIFR
                </label>
            </div>
        </div>
        <div class="filter-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">
            <span class="filter-label">Overlays:</span>
            <label class="checkbox-label" style="display: block; margin-top: 5px;">
                <input type="checkbox" id="showTFRs"> Show TFRs
            </label>
        </div>
        <button onclick="updateMap()">Refresh Data</button>
    </div>
    
    <div class="legend">
        <div class="legend-title">Flight Categories</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00AA00;"></div>
            <span>VFR - Visual</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FFD700;"></div>
            <span>MVFR - Marginal</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF0000;"></div>
            <span>IFR - Instrument</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #FF00FF;"></div>
            <span>LIFR - Low IFR</span>
        </div>
    </div>
    
    <div id="loading" class="loading-overlay" style="display: none;">Loading weather data...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let markers = [];
        let tfrLayer = L.layerGroup();  // Layer for TFRs
        
        // Initialize map centered on CONUS
        function initMap() {
            try {
                // Check if Leaflet is loaded
                if (typeof L === 'undefined') {
                    console.error('Leaflet library not loaded!');
                    document.getElementById('loading').innerHTML = 'Error: Map library failed to load';
                    return;
                }
                
                map = L.map('map').setView([39.8, -98.6], 5);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 18
                }).addTo(map);
                
                // Load initial data
                updateMap();
                
                // Refresh on map move
                map.on('moveend', updateMap);
                
                // Auto-refresh every 5 minutes
                setInterval(updateMap, 5 * 60 * 1000);
                
            } catch (error) {
                console.error('Map initialization error:', error);
                document.getElementById('loading').innerHTML = 'Error initializing map: ' + error.message;
            }
        }
        
        function updateMap() {
            // Safety check
            if (!map) {
                console.error('Map not initialized');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            // Get current map bounds
            const bounds = map.getBounds();
            const boundsStr = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
            
            // Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            
            // Fetch data within bounds
            fetch(`/cap_winds_app/api/weather/metar/recent?bounds=${boundsStr}&limit=5000`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    
                    // Get filter settings
                    const showVFR = document.getElementById('showVFR').checked;
                    const showMVFR = document.getElementById('showMVFR').checked;
                    const showIFR = document.getElementById('showIFR').checked;
                    const showLIFR = document.getElementById('showLIFR').checked;
                    
                    // Add markers
                    data.metars.forEach(metar => {
                        // Filter by flight category
                        if (metar.flight_category === 'VFR' && !showVFR) return;
                        if (metar.flight_category === 'MVFR' && !showMVFR) return;
                        if (metar.flight_category === 'IFR' && !showIFR) return;
                        if (metar.flight_category === 'LIFR' && !showLIFR) return;
                        
                        addMarker(metar);
                    });
                    
                    // Load TFRs if enabled
                    loadTFRs();
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    alert('Error loading weather data: ' + error);
                });
        }
        
        function addMarker(metar) {
            const color = getCategoryColor(metar.flight_category);
            
            // Create custom icon
            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    width: 12px;
                    height: 12px;
                    background: ${color};
                    border: 2px solid #000;
                    border-radius: 50%;
                    box-shadow: 0 0 4px rgba(0,0,0,0.5);
                "></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });
            
            const marker = L.marker([metar.latitude, metar.longitude], { icon: icon });
            
            // Tooltip on hover
            marker.bindTooltip(`${metar.station_id} - ${metar.flight_category}`, {
                permanent: false,
                direction: 'top',
                offset: [0, -10]
            });
            
            // Popup on click
            marker.on('click', () => {
                showStationPopup(metar);
            });
            
            marker.addTo(map);
            markers.push(marker);
        }
        
        function showStationPopup(metar) {
            // Fetch detailed data including TAF
            Promise.all([
                fetch(`/cap_winds_app/api/weather/metar/station/${metar.station_id}?hours=3`).then(r => r.json()),
                fetch(`/cap_winds_app/api/weather/taf/station/${metar.station_id}`).then(r => r.json()).catch(() => null)
            ]).then(([metarData, tafData]) => {
                const latestMetar = metarData.metars[0];
                const obsType = latestMetar.is_speci ? 'SPECI' : 'METAR';
                
                let popupHtml = `
                    <div class="popup-header">${metar.station_id}</div>
                    
                    <div class="popup-section">
                        <div class="popup-label">${obsType} @ ${formatTime(latestMetar.observation_time)}</div>
                        <div class="popup-text">${latestMetar.raw_text}</div>
                        
                        <div class="popup-data">
                            <div class="popup-data-item">
                                <span class="popup-data-label">Category:</span><br>
                                <span class="flight-category cat-${latestMetar.flight_category}">${latestMetar.flight_category}</span>
                            </div>
                            ${latestMetar.temp_c !== null ? `
                            <div class="popup-data-item">
                                <span class="popup-data-label">Temp/Dewpoint:</span><br>
                                <span class="popup-data-value">${Math.round(latestMetar.temp_c)}°C / ${latestMetar.dewpoint_c !== null ? Math.round(latestMetar.dewpoint_c) + '°C' : 'N/A'}</span>
                            </div>
                            ` : ''}
                            ${latestMetar.wind_speed_kts !== null ? `
                            <div class="popup-data-item">
                                <span class="popup-data-label">Wind:</span><br>
                                <span class="popup-data-value">${formatWind(latestMetar)}</span>
                            </div>
                            ` : ''}
                            <div class="popup-data-item">
                                <span class="popup-data-label">Ceiling:</span><br>
                                <span class="popup-data-value">${formatCeiling(getCeiling(latestMetar))}</span>
                            </div>
                            ${latestMetar.visibility_sm !== null ? `
                            <div class="popup-data-item">
                                <span class="popup-data-label">Visibility:</span><br>
                                <span class="popup-data-value">${latestMetar.visibility_sm} SM</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                
                if (tafData && !tafData.error) {
                    popupHtml += `
                        <div class="popup-section" style="border-top: 1px solid #ccc; padding-top: 10px;">
                            <div class="popup-label">TAF FORECAST</div>
                            <div class="popup-text">${tafData.raw_text}</div>
                            <div class="popup-label" style="margin-top: 5px; font-size: 10px;">
                                Valid: ${formatTime(tafData.valid_from)} to ${formatTime(tafData.valid_to)}
                            </div>
                        </div>
                    `;
                }
                
                L.popup()
                    .setLatLng([metar.latitude, metar.longitude])
                    .setContent(popupHtml)
                    .openOn(map);
            });
        }
        
        function getCategoryColor(category) {
            const colors = {
                'VFR': '#00AA00',
                'MVFR': '#FFD700',
                'IFR': '#FF0000',
                'LIFR': '#FF00FF'
            };
            return colors[category] || '#888888';
        }
        
        function formatTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            const day = date.getUTCDate().toString().padStart(2, '0');
            const hours = date.getUTCHours().toString().padStart(2, '0');
            const minutes = date.getUTCMinutes().toString().padStart(2, '0');
            return `${day}${hours}${minutes}Z`;
        }
        
        function formatWind(metar) {
            const dir = metar.wind_dir !== null ? metar.wind_dir.toString().padStart(3, '0') : 'VRB';
            const spd = metar.wind_speed_kts;
            const gust = metar.wind_gust_kts !== null ? `G${metar.wind_gust_kts}` : '';
            return `${dir}/${spd}${gust} KT`;
        }
        
        function loadTFRs() {
            const showTFRs = document.getElementById('showTFRs').checked;
            
            // Clear existing TFRs
            tfrLayer.clearLayers();
            
            if (!showTFRs) {
                return;
            }
            
            // Get map bounds
            const bounds = map.getBounds();
            const boundsStr = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
            
            // Fetch TFRs
            fetch(`/cap_winds_app/api/weather/tfr/active?bounds=${boundsStr}`)
                .then(response => response.json())
                .then(data => {
                    if (data.tfrs) {
                        data.tfrs.forEach(tfr => {
                            if (tfr.geometry) {
                                // Parse GeoJSON geometry
                                const geoJson = L.geoJSON(tfr.geometry, {
                                    style: {
                                        color: '#FF0000',
                                        fillColor: '#FF0000',
                                        fillOpacity: 0.15,
                                        weight: 2,
                                        dashArray: '5, 5'
                                    }
                                });
                                
                                // Add popup
                                const popupContent = `
                                    <div style="font-family: 'Courier New', monospace; min-width: 250px;">
                                        <div style="font-weight: bold; font-size: 14px; color: #FF0000; margin-bottom: 8px;">
                                            🚫 TFR ${tfr.tfr_number}
                                        </div>
                                        <div style="font-size: 12px; line-height: 1.5;">
                                            <strong>Type:</strong> ${tfr.type}<br>
                                            ${tfr.city ? `<strong>Location:</strong> ${tfr.city}, ${tfr.state}<br>` : ''}
                                            ${tfr.facility ? `<strong>Facility:</strong> ${tfr.facility}<br>` : ''}
                                            <strong>Effective:</strong><br>
                                            &nbsp;&nbsp;${formatTFRTime(tfr.effective_start)} to<br>
                                            &nbsp;&nbsp;${formatTFRTime(tfr.effective_end)}<br>
                                            ${tfr.lower_altitude_ft !== null ? `<strong>Altitude:</strong> ${tfr.lower_altitude_ft}' - ${tfr.upper_altitude_ft}' MSL<br>` : ''}
                                        </div>
                                    </div>
                                `;
                                
                                geoJson.bindPopup(popupContent);
                                geoJson.addTo(tfrLayer);
                            }
                        });
                        
                        // Add TFR layer to map
                        tfrLayer.addTo(map);
                    }
                })
                .catch(error => {
                    console.error('Error loading TFRs:', error);
                });
        }
        
        function formatTFRTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            return date.toLocaleString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit',
                timeZone: 'UTC',
                timeZoneName: 'short'
            });
        }
        
        // TFR checkbox change handler
        document.getElementById('showTFRs').addEventListener('change', loadTFRs);
        
        function getCeiling(metar) {
            // Calculate ceiling from sky conditions
            if (!metar.sky_conditions || metar.sky_conditions.length === 0) {
                return null;
            }
            
            let ceiling = null;
            for (const layer of metar.sky_conditions) {
                if (layer.cover === 'BKN' || layer.cover === 'OVC') {
                    if (layer.height_ft) {
                        if (ceiling === null || layer.height_ft < ceiling) {
                            ceiling = layer.height_ft;
                        }
                    }
                }
            }
            return ceiling;
        }
        
        function formatCeiling(ceiling) {
            if (ceiling === null) return 'None';
            if (ceiling >= 1000) {
                return `${(ceiling / 100).toFixed(0)}00 ft`;
            }
            return `${ceiling} ft`;
        }
        
        // Wait for DOM and Leaflet to be ready
        window.addEventListener('load', function() {
            initMap();
        });
    </script>
</body>
</html>
