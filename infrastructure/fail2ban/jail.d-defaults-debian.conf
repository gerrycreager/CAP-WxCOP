[DEFAULT]
banaction = nftables-allports
banaction_allports = nftables[type=allports]
backend = systemd
ignoreip = 192.168.0.0/24
bantime = -1 
bantime.increment = true
bantime.factor = 1
bantime.maxtime = -1


[sshd]
enabled = true
# Loosened 2026-09-17 at Gerry's direction -- see jail.local for rationale
# (MFA-gated SSH, single authorized user, permanent/short-lockout risk
# outweighs benefit). This jail-specific override was masking jail.local's
# [DEFAULT] bantime, since a jail section always wins over DEFAULT
# regardless of which file it's in.
bantime = 24h
action = %(action_)s

[blacklist]
enabled = true
filter = blacklist
logpath = /etc/fail2ban/ip.blacklist
bantime = -1
findtime = 86400
maxretry = 1
action = %(action_)s

