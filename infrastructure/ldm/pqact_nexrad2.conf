## pqact_nexrad2.conf - NEXRAD Level II Radar Data
## Feedtype: NEXRAD2
## Format: Native Level II format (directly usable by MetPy)
## NOTE: Fields are separated by TABS (not spaces)
## NOTE: Level II data arrives in fragments that must be assembled
## NOTE: Fragments can arrive OUT OF ORDER
##

# NEXRAD Level II - Intermediate fragments (sequence number in 5th field)
# Pattern: L2-BZIP2/SITE/TIMESTAMP/VOL/SEQ/FLAG/VERSION/0
# Save each fragment separately with sequence number in filename
#NEXRAD2	^L2-BZIP2/([A-Z][A-Z][A-Z][A-Z])/([0-9]{14})/([0-9]+)/([0-9]+)/([IV])/V06/0$	FILE	-close	/LDM/radar/level2/tmp/\1/\1_\2_\3_seq\4

# NEXRAD Level II - Final fragment (E in 5th field)
# Pattern: L2-BZIP2/SITE/TIMESTAMP/VOL/E/FLAG/VERSION/0
# This triggers assembly of all fragments in correct order
#NEXRAD2	^L2-BZIP2/([A-Z][A-Z][A-Z][A-Z])/([0-9]{14})/([0-9]+)/E/([IV])/V06/0$	EXEC	-close	"/home/ldm/util/assemble_level2.sh \1 \2 \3 \(yyyy)\(mm)\(dd)"
##
## pqact_nexrad2.conf - NEXRAD Level II Radar Data
## Feedtype: NEXRAD2
## NOTE: LDM automatically assembles fragments when writing to same filename
##

# NEXRAD Level II - All fragments (I, V, E)
# LDM will automatically assemble in correct order when writing to same file
# Pattern: L2-BZIP2/SITE/YYYYMMDDHHMMSS/VOL/SEQ/FLAG/VERSION/0
NEXRAD2	^L2-BZIP2/([A-Z]{4})/([0-9]{8})([0-9]{6})/([0-9]+)/([0-9]+|E)/[IVE]/V0[0-9]/0$	FILE	-close	/LDM/radar/level2/\1/\2/\1_\2\3_\4.ar2v

##
## How this works:
## Example sequence for volume 283 at KSJT on 2026-01-01 00:21:18:
##
## Fragments arrive (possibly out of order):
##    L2-BZIP2/KSJT/20260101002118/283/5/I/V06/0   -> /LDM/radar/level2/tmp/KSJT/KSJT_20260101002118_283_seq5
##    L2-BZIP2/KSJT/20260101002118/283/0/I/V06/0   -> /LDM/radar/level2/tmp/KSJT/KSJT_20260101002118_283_seq0
##    L2-BZIP2/KSJT/20260101002118/283/13/I/V06/0  -> /LDM/radar/level2/tmp/KSJT/KSJT_20260101002118_283_seq13
##    L2-BZIP2/KSJT/20260101002118/283/2/I/V06/0   -> /LDM/radar/level2/tmp/KSJT/KSJT_20260101002118_283_seq2
##    ... (more fragments)
##
## Final fragment arrives:
##    L2-BZIP2/KSJT/20260101002118/283/E/I/V06/0
##    -> triggers: /home/ldm/util/assemble_level2.sh KSJT 20260101002118 283 20260101
##    -> script assembles all fragments in sequence order (seq0, seq1, seq2, ... seq13)
##    -> creates: /LDM/radar/level2/KSJT/20260101/KSJT_20260101002118.bz2
##    -> cleans up tmp files
##
## The assemble_level2.sh script must:
##    1. Concatenate all fragments in sequence order: seq0, seq1, seq2, ..., seqN
##    2. Use dccraft_move to move to final location
##    3. Clean up temporary fragment files
##
## NOTE: NEXRAD Level II data is stored in bzip2 compressed format.
## This format is directly readable by:
##   - MetPy: from metpy.io import Level2File; f = Level2File('file.bz2')
##   - Py-ART: pyart.io.read_nexrad_archive('file.bz2')
##
