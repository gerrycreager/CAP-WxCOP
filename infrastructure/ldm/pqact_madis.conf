# MADIS FSL2 surface obs -- decode gzip-netCDF directly via PIPE, one
# child process per product (-close). Deliberately NOT -strip: the
# product is binary gzip-compressed netCDF, not text, and -strip would
# corrupt it. See scripts/ingest_madis_surface.py for the decode/filter
# logic and observations.madis_surface_obs for storage; station/provider
# scope (hfmetar unfiltered, mesonet2 filtered to APRSWXNET + DOT-with-
# standard-fields only) is Gerry's 2026-10-28 decision -- see the
# reference-madis-archive-access memory for the full rationale.
FSL2	^FSL\.CompressedNetCDF\.MADIS\.hfmetar\.		PIPE	-close	/var/www/cap_winds_app/venv/bin/python3 /var/www/cap_winds_app/scripts/ingest_madis_surface.py --stream hfmetar
FSL2	^FSL\.CompressedNetCDF\.MADIS\.mesonet2\.	PIPE	-close	/var/www/cap_winds_app/venv/bin/python3 /var/www/cap_winds_app/scripts/ingest_madis_surface.py --stream mesonet2
