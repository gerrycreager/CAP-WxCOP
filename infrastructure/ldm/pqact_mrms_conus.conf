# pqact_mrms.conf — CONUS MRMS tile rendering for data1
# Last modified: 2026-04-11
#
# Handles: CONUS only — OCONUS moved to data2/pqact_mrms_oconus.conf
# Products: MergedReflectivityQComposite, MESH, MESH_Max_30min,
#           LightningProbability, MergedAzShear
#
# Product identifier format from feed:
#   grib2/CONUS/MRMS_ProductName_HH.HH_YYYYMMDD-HHMMSS.grib2.gz
#
# IMPORTANT: Both FILE and PIPE patterns must anchor on grib2/CONUS/ to avoid
# matching the spcnids NID variants (same product name, different path, smaller
# file). The spcnids path produces a ~360KB NID; grib2 path produces ~2.2MB
# grib2.gz. Without the path anchor the PIPE fires on the wrong product.
#
# Two actions per product:
#   FILE  - archives raw grib2.gz; \1 = full filename from capture group
#   PIPE  - renders tiles; \1\2\3=YYYYMMDD  \4\5\6=HHMMSS
#
# After any edit:
#   ldmadmin pqactcheck -p /home/ldm/etc/pqact_mrms_conus.conf
#   sudo systemctl restart ldm

# =============================================================================
# CONUS PRODUCTS
# =============================================================================

# -- CONUS Composite Reflectivity ---------------------------------------------
EXP	grib2/CONUS/(MRMS_MergedReflectivityQComposite_[^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Composite/\1
EXP	grib2/CONUS/MRMS_MergedReflectivityQComposite_[0-9.]+_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])-([0-9][0-9])([0-9][0-9])([0-9][0-9])\.grib2\.gz$
	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh composite CONUS \1\2\3 \4\5\6

# -- CONUS Reflectivity at Lowest Altitude (RALA — uncomment when confirmed) --
#EXP	grib2/CONUS/(MRMS_ReflectivityAtLowestAltitude_[^/]+\.grib2\.gz)$
