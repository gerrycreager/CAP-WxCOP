#	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh rala CONUS \1\2\3 \4\5\6

# -- CONUS MESH (instantaneous) -----------------------------------------------
EXP	grib2/CONUS/(MRMS_MESH_[0-9][^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Severe/\1
EXP	grib2/CONUS/MRMS_MESH_[0-9.]+_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])-([0-9][0-9])([0-9][0-9])([0-9][0-9])\.grib2\.gz$
	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh mesh CONUS \1\2\3 \4\5\6

