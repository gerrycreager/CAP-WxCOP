### Fire Weather Day 1
IDS|DDPLUS	^(FNUS21) (.{4}) (..)(..)(..)
	FILE	-overwrite	-log	-close	-strip	/LDM/fire/(\3:yyyy)(\3:mm)\3/\4/\1_\2_\3\4\5_(seq).%Y%m%d%H
	PIPE	/bin/mail -s "Fire Weather Outlook DAY 1" 5d35beba.capnhq.gov@amer.teams.ms < /LDM/fire/(\3:yyyy)(\3:mm)\3/\4/\1_\2_\3\4\5_(seq).%Y%m%d%H
### Fire Weather Day 2
