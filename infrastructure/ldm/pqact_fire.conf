# Fire Weather Products - FDI, FRW, FWE, FWF, FWW, RFD, RFW
# Changed ^...... to ^FNUS to prevent matching SDUS radar products
IDS|DDPLUS	^FNUS.. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FDI)
	FILE	-strip	/LDM/fire/\4/(\1:yyyy)(\1:mm)\1\2.\4
