##
## pqact_fire.conf - Fire Weather Products
## Feedtype: IDS|DDPLUS
## Deploy to: data1:/home/ldm/etc/pqact_fire.conf
## After deploy: ldmadmin pqactcheck /home/ldm/etc/pqact_fire.conf
##               ldmadmin pqactHUP
##
## All fields separated by TABS.
##
## Filename convention: KWFO_YYYYMMDD_HHMMZ.txt
##   Product type is implicit from the containing directory.
##   Examples:
##     /LDM/fire/FWF/2026/03/26/KPUB_20260326_0500Z.txt
##     /LDM/fire/RFD/2026/03/26/KSGF_20260326_0506Z.txt
##     /LDM/fire/RFW/2026/03/26/KDEN_20260326_1200Z.txt
##
##   Legacy watch headers (FWW, FRW) retain their original WMO prefix
##   in the filename so the product origin remains identifiable:
##     /LDM/fire/RFW/2026/03/26/FWW_KPUB_20260326_0500Z.txt
##     /LDM/fire/RFW/2026/03/26/FRW_KPUB_20260326_0500Z.txt
##
## Directory structure: /LDM/fire/PRODUCTTYPE/YYYY/MM/DD/
##   /LDM/fire/DAY1/    SPC Day 1 Fire Weather Outlook
##   /LDM/fire/DAY2/    SPC Day 2 Fire Weather Outlook
##   /LDM/fire/FDI/     Fire Danger Index
##   /LDM/fire/FWE/     Fire Weather Extended Outlook
##   /LDM/fire/FWF/     Fire Weather Forecast (primary daily product)
##   /LDM/fire/FWL/     Fire Weather Long Range
##   /LDM/fire/FWM/     Fire Weather Matrix
##   /LDM/fire/FWS/     Fire Weather Statement/Special
##   /LDM/fire/RFD/     Red Flag Discussion
##   /LDM/fire/RFW/     Red Flag Warning (+ legacy FWW/FRW)
##
## WMO header decode:
##   FNUS21 KWNS 260500   <- SPC Day 1 Fire Outlook
##   FNUS63 KSGF 260506   <- Local WFO product
##   ^TTAAII CCCC DDHHMM
##   \1=CCCC(WFO)  \2=DD  \3=HH  \4=MM
##
## Product type distinguished via AWIPS PIL suffix (/pXXX) in product ID.
## This avoids multiline pattern matching and is reliable across all offices.
##

##############################################################################
# SPC Fire Weather Outlooks
# Issuing office: KWNS (Storm Prediction Center, Norman OK)
# FNUS21 = Day 1, FNUS22 = Day 2
# High priority - Teams notification preserved
##############################################################################

# SPC Day 1 Fire Weather Outlook
IDS|DDPLUS	^FNUS21 (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9])
	FILE	-close	-strip	/LDM/fire/DAY1/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt
	PIPE	-close	/bin/mail -s "SPC Fire Weather Outlook DAY 1" 5d35beba.capnhq.gov@amer.teams.ms

# SPC Day 2 Fire Weather Outlook
IDS|DDPLUS	^FNUS22 (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9])
	FILE	-close	-strip	/LDM/fire/DAY2/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt
	PIPE	-close	/bin/mail -s "SPC Fire Weather Outlook DAY 2" 5d35beba.capnhq.gov@amer.teams.ms


##############################################################################
# Local WFO Fire Weather Products
# \1=WFO (e.g. KPUB)  \2=DD  \3=HH  \4=MM
##############################################################################

# Fire Weather Forecast - primary daily operational product
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FWF)
	FILE	-close	-strip	/LDM/fire/FWF/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Fire Weather Extended Outlook (Day 3-7)
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FWE)
	FILE	-close	-strip	/LDM/fire/FWE/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Fire Weather Long Range Forecast
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FWL)
	FILE	-close	-strip	/LDM/fire/FWL/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Fire Weather Statement / Special
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FWS)
	FILE	-close	-strip	/LDM/fire/FWS/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Fire Weather Matrix
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FWM)
	FILE	-close	-strip	/LDM/fire/FWM/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Red Flag Warning (current standard)
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(RFW)
	FILE	-close	-strip	/LDM/fire/RFW/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Red Flag Discussion
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(RFD)
	FILE	-close	-strip	/LDM/fire/RFD/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Fire Danger Index
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FDI)
	FILE	-close	-strip	/LDM/fire/FDI/%Y/%m/%d/\1_%Y%m%d_%H%MZ.txt

# Fire Weather Watch - legacy FWW header (filename prefixed to distinguish)
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FWW)
	FILE	-close	-strip	/LDM/fire/RFW/%Y/%m/%d/FWW_\1_%Y%m%d_%H%MZ.txt

# Fire Weather Watch - legacy FRW header (filename prefixed to distinguish)
IDS|DDPLUS	^FNUS[0-9][0-9] (K[A-Z]{3}) ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FRW)
	FILE	-close	-strip	/LDM/fire/RFW/%Y/%m/%d/FRW_\1_%Y%m%d_%H%MZ.txt
