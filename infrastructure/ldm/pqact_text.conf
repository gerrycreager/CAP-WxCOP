##
## pqact_text.conf - Text Products (METAR, AIRMET, SIGMET, Watches, Warnings)
## Updated with modern WMO header patterns
## Feedtype: IDS|DDPLUS
## NOTE: Fields are separated by TABS (not spaces)
## NOTE: Uses strftime format codes: %Y=year, %m=month, %d=day, %H=hour, %M=minute
##

# METAR observations (collective bulletins)
# Modern format uses SAUS, SACA (Canadian), etc.
IDS|DDPLUS	^SA[A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/metar/%Y/%m/%d/\1_METAR-%Y%m%d-%H%M.txt

# SPECI (special weather reports)
# Modern format uses SPUS, SPCA (Canadian), etc.
IDS|DDPLUS	^SP[A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/speci/%Y/%m/%d/\1_SPECI-%Y%m%d-%H%M.txt

# SIGMETs (includes convective SIGMETs)
# WS = non-convective SIGMET, WV = volcanic ash SIGMET
IDS|DDPLUS	^W[SV][A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/sigmet/%Y/%m/%d/\1_SIGMET-%Y%m%d-%H%M.txt

# AIRMETs
# WA = AIRMET bulletins
IDS|DDPLUS	^WA[A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/airmet/%Y/%m/%d/\1_AIRMET-%Y%m%d-%H%M.txt

# Graphical AIRMETs (G-AIRMET) - may use different headers
# LWGE86 KKCI 122045 as an example
#IDS|DDPLUS	^WAG[A-Z0-9][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/gairmet/%Y/%m/%d/\1_GAIRMET-%Y%m%d-%H%M.txt
IDS|DDPLUS	^LW[GHI]E[0-9][0-9] KKCI		FILE	-close -strip	/LDM/text/gairmet/%Y/%m/%d/\1_GAIRMET-%Y%m%d-%H%M.txt

# Severe Thunderstorm Warnings
# WUUS followed by region code
IDS|DDPLUS	^WUUS[0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/warnings/svr/%Y/%m/%d/\1_SVR-%Y%m%d-%H%M.txt

# Tornado Warnings  
# WUUS followed by region code (typically 20, 21, 22, etc.)
IDS|DDPLUS	^WFUS[0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/warnings/tor/%Y/%m/%d/\1_TOR-%Y%m%d-%H%M.txt

# Flash Flood Warnings
# WGUS followed by region code
IDS|DDPLUS	^WGUS[0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/warnings/ffw/%Y/%m/%d/\1_FFW-%Y%m%d-%H%M.txt

# Severe Weather Watches (Severe Thunderstorm and Tornado)
# WWUS followed by watch number
IDS|DDPLUS	^WWUS[0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/watches/%Y/%m/%d/\1_WATCH-%Y%m%d-%H%M.txt

# Additional warning products - generic catch for any WW or WU products
IDS|DDPLUS	^W[WU][A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/warnings/other/%Y/%m/%d/\1_WARN-%Y%m%d-%H%M.txt

# TAFs (Terminal Aerodrome Forecasts)
# FTUS, FTCA (Canadian), etc.
IDS|DDPLUS	^FT[A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/taf/%Y/%m/%d/\1_TAF-%Y%m%d-%H%M.txt

# PIREPs (Pilot Reports)
# UAUS, UACA (Canadian), etc.
IDS|DDPLUS	^UA[A-Z][A-Z][0-9][0-9] ([A-Z]{4})	FILE	-close -strip	/LDM/text/pirep/%Y/%m/%d/\1_PIREP-%Y%m%d-%H%M.txt

