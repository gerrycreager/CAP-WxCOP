# =============================================================================
# pqact_mrms.conf - MRMS GRIB2 ingest and tile rendering
#
# Two actions per product:
#   FILE  - archives raw GRIB2.gz
#   PIPE  - renders tiles via mrms_render_pipe.sh → mrms_tile_renderer.py
#
# Products rendered (Phase 1):
#   composite  - MergedReflectivityQComposite  (2-min, CONUS mosaic)
#   mesh       - MESH instantaneous hail size  (2-min)
#   lightning  - LightningProbabilityNext60min (2-min)
#   azshear    - MergedAzShear01kmAGL          (2-min, low-level 0-2km AGL)
#
# Phase 2 additions (not yet rendered):
#   MRMS_MergedAzShear03kmAGL_  - mid-level shear (0-6km AGL)
#   MRMS_RotationTrack30min_    - 30-min rotation track accumulation
#   MRMS_RotationTrack60min_    - 60-min rotation track accumulation
#
# NOTE on azimuthal shear product name:
#   Verify actual IDD product identifier before enabling PIPE action.
#   Run: notifyme -v -h idd.unidata.ucar.edu -f EXP -p "MRMS.*AzShear" -o 600
#   The FILE action below will confirm arrival before enabling rendering.
#
# After any edit: ldmadmin pqactHup
# =============================================================================

# -- Composite Reflectivity ---------------------------------------------------
EXP	(MRMS_MergedReflectivityQComposite_[^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Composite/\1

###EXP	MRMS_MergedReflectivityQComposite_[^/]+\.grib2\.gz$
###	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh composite CONUS

# -- MESH (Max Expected Size of Hail) -----------------------------------------
EXP	(MRMS_MESH_[0-9][^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Severe/\1

###EXP	MRMS_MESH_[0-9][^/]+\.grib2\.gz$
###	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh mesh CONUS

# -- Lightning Probability ----------------------------------------------------
EXP	(MRMS_LightningProbabilityNext60minGrid_[^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Lightning/\1

###EXP	MRMS_LightningProbabilityNext60minGrid_[^/]+\.grib2\.gz$
###	PIPE	-close	home/ldm/scripts/mrms_render_pipe.sh lightning CONUS

# -- Azimuthal Shear 0-2km AGL ------------------------------------------------
# Low-level shear: primary tornado/mesocyclone detection product.
# FILE action enabled now to confirm product name and arrival rate.
# PIPE action: uncomment after confirming FILE archive receives data.
# Product name may vary — check /LDM/radar/mrms/YYYY/MM/DD/AzShear/ contents.
EXP	(MRMS_MergedAzShear01kmAGL_[^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/AzShear/\1

# Uncomment after confirming product arrives:
#EXP	MRMS_MergedAzShear01kmAGL_[^/]+\.grib2\.gz$
#	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh azshear CONUS
