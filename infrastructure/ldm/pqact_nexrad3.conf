## pqact_nexrad3.conf - NEXRAD Level III - OPTIMIZED for Essential Products Only
## Location: /home/ldm/etc/pqact_nexrad3.conf
## Updated: 2026-02-08 - Filtered to only critical graphic products
## Generates PNG with .pgw world file for georeferencing
##
## PRODUCTS PROCESSED (5 per radar):
##   NCR  - Composite Reflectivity
##   N0Q  - Base Reflectivity (0.5° tilt)
##   N0B  - Base Reflectivity (legacy)
##   N0S  - Storm Relative Velocity
##   N0U  - Base Velocity
##   N0H  - Hydrometeor Classification
##
## This processes ~5 products per radar instead of 50+, reducing load by 90%

#############################################################################
# COMPOSITE REFLECTIVITY (NCR) - Shows max reflectivity at any altitude
#############################################################################

# Store NIDS file
NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(NCR)([A-Z]{3})
	FILE	-close	/LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids

# Generate PNG
NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(NCR)([A-Z]{3})
	EXEC	/home/ldm/ldm-venv/bin/python3 /home/ldm/bin/nids2geopng.py -i /LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids -o /LDM/radar/level3/\5/\4/png/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.png -s \5 -p \4

#############################################################################
# BASE REFLECTIVITY (N0Q, N0B) - Lowest tilt reflectivity
#############################################################################

# Store NIDS file
NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(N0[QB])([A-Z]{3})
	FILE	-close	/LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids

# Generate PNG
#NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(N0[QB])([A-Z]{3})
#	EXEC	/home/ldm/ldm-venv/bin/python3 /home/ldm/bin/nids2geopng.py -i /LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids -o /LDM/radar/level3/\5/\4/png/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.png -s \5 -p \4

#############################################################################
# VELOCITY PRODUCTS (N0S, N0U) - Storm Relative and Base Velocity
#############################################################################

# Store NIDS file
NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(N0[SU])([A-Z]{3})
	FILE	-close	/LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids

# Generate PNG
#NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(N0[SU])([A-Z]{3})
#	EXEC	/home/ldm/ldm-venv/bin/python3 /home/ldm/bin/nids2geopng.py -i /LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids -o /LDM/radar/level3/\5/\4/png/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.png -s \5 -p \4

#############################################################################
# HYDROMETEOR CLASSIFICATION (N0H) - Rain/Snow/Hail identification
#############################################################################

# Store NIDS file
NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(N0H)([A-Z]{3})
	FILE	-close	/LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids

# Generate PNG
#NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(N0H)([A-Z]{3})
#	EXEC	/home/ldm/ldm-venv/bin/python3 /home/ldm/bin/nids2geopng.py -i /LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids -o /LDM/radar/level3/\5/\4/png/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.png -s \5 -p \4

#############################################################################
# RADAR STATUS MESSAGES (FTM) - Free Text Message (status, VCP, outages)
#############################################################################
# NOTE: This is a TEXT product, so we only store it (no PNG generation)

NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p(FTM)([A-Z]{3})
	FILE	-close	/LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids

#############################################################################
# CATCH-ALL FOR OTHER PRODUCTS (NIDS only, no PNG)
#############################################################################
# Stores all other NEXRAD3 products without PNG generation

NEXRAD3	^SDUS[2-8]. .... ([0-3][0-9])([0-2][0-9])([0-5][0-9]).*/p([A-Z0-9]{3,4})([A-Z]{3})
	FILE	-close	/LDM/radar/level3/\5/\4/nids/(\1:yyyy)(\1:mm)(\1:dd)/\5_\4_\1\2\3.nids

#############################################################################
# OUTPUT STRUCTURE
#############################################################################
#
# NIDS files: /LDM/radar/level3/SITE/PRODUCT/nids/YYYYMMDD/SITE_PRODUCT_DDHHMM.nids
# PNG files:  /LDM/radar/level3/SITE/PRODUCT/png/YYYYMMDD/SITE_PRODUCT_DDHHMM.png
# PGW files:  /LDM/radar/level3/SITE/PRODUCT/png/YYYYMMDD/SITE_PRODUCT_DDHHMM.pgw
#
# PRODUCTS WITH PNG GENERATION:
#   NCR  - Composite Reflectivity
#   N0Q  - Base Reflectivity (0.5° tilt)
#   N0B  - Base Reflectivity (legacy)
#   N0S  - Storm Relative Velocity
#   N0U  - Base Velocity
#   N0H  - Hydrometeor Classification
#
# FTM (Free Text Message) contains:
#   - Radar operational status
#   - VCP (Volume Coverage Pattern) mode
#   - Outage notifications
#   - Maintenance schedules
#
# All other products are stored as NIDS files only (no PNG generation)
#
#############################################################################

#############################################################################
# ESTIMATED LOAD
#############################################################################
#
# BEFORE: ~50 products/radar × 160 radars = 8,000 PNG generations/cycle
# AFTER:  ~6 products/radar × 160 radars = 960 PNG generations/cycle
# REDUCTION: 88% fewer EXEC processes
#
#############################################################################
