##
## pqact_hds_tpw.conf - NESDIS ABI L2 derived products via HDS/WMO bulletins
## Feedtype: HDS
##
## Payload is HDF5, wrapped behind a WMO bulletin header (NOT GRIB2) -- archived
## as-received; the WMO header text needs stripping (search for \x89HDF magic)
## before any HDF5/netCDF4 reader can open the file.
##
## Full IXT catalog on this feed identified 2026-07-10 by inspecting each
## variant's internal 'dataset_name'/'title' attributes -- see
## /LDM/hds/tpw_test/ for one sample of each, and scripts/scan_ixt.py-style
## inspection to re-derive if the catalog changes.
##
## Rules are kept one-product-per-line (no alternation) on purpose -- this
## mirrors the same wildcarding caution being tested for ABI L1b corruption.
##

## ── Active: Total Precipitable Water ────────────────────────────────────────
## IXTO89 = ABI-L2-TPWF (G18/West, Full Disk)   IXTO99 = ABI-L2-TPWM1 (G19/East, Mesoscale-1)
## (corrected 2026-07-12 -- verified against each file's own dataset_name/
## scene_id attributes; this was previously listed backwards)
HDS	^(IXTO89) ([A-Z]{4}) ([0-9]{6})
	FILE	-close	/LDM/hds/tpw/\1_\2_\3.%Y%m%d%H%M%S.grib2
HDS	^(IXTO99) ([A-Z]{4}) ([0-9]{6})
	FILE	-close	/LDM/hds/tpw/\1_\2_\3.%Y%m%d%H%M%S.grib2

