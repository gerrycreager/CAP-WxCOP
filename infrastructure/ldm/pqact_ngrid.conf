##
## pqact_ngrid.conf - HRRR Model Data (Updated for CAP Winds App)
## Feedtype: NGRID
## Output: GRIB2 format organized by date/cycle
##

# HRRR CONUS - 2D surface fields (commented out - using catch-all below)
#NGRID	^HRRR\.CONUS\.2D\.surface\.(....)(..)(..)\.(..)(..)\.f([0-9][0-9])
#	FILE	/LDM/models/hrrr/surface/(\1:yyyy)(\1:mm)(\1:dd)/hrrr_surface_\1_\2z_f\3.grib2

# HRRR CONUS - Pressure level data (commented out - rarely used)
#NGRID	^GRIB2.*.HRRR.*pgrb2/([0-9]{8})([0-2][0-9])00.F([0-9]{3})
#	FILE	-close	/LDM/models/hrrr/pressure/(\1:yyyy)(\1:mm)(\1:dd)/hrrr_pressure_\1_\2z_f\3.grib2

# HRRR CONUS - Native hybrid coordinate data (commented out - rarely used)
#NGRID	^GRIB2.*.HRRR.*nat/([0-9]{8})([0-2][0-9])00.F([0-9]{3})
#	FILE	-close	/LDM/models/hrrr/native/(\1:yyyy)(\1:mm)(\1:dd)/hrrr_native_\1_\2z_f\3.grib2

# HRRR CONUS - All products organized for CAP Winds App
# Saves to structure: /LDM/models/hrrr/hrrr.YYYYMMDD/HHz/hrrr.tHHz.wrfsfcfFF.grib2
# This matches what states_service.py expects in find_local_cycle_dir()
NGRID	^.*grib2/ncep/HRRR/.*/([0-9]{8})([0-9]{2})00F([0-9]{2,3})
	FILE	-close	/LDM/models/hrrr/hrrr.\1/\2z/hrrr.t\2z.wrfsfcf\3.grib2

##
## HRRR Organization:
##   Location: /LDM/models/hrrr/
##   Structure: hrrr.YYYYMMDD/HHz/hrrr.tHHz.wrfsfcfFF.grib2
##   Example: hrrr.20260101/16z/hrrr.t16z.wrfsfcf00.grib2
##
## This structure matches the CAP Winds App expectations:
##   - states_service.py Config.MODEL_ROOT should point to /LDM/models/hrrr
##   - find_local_cycle_dir() looks for hrrr.YYYYMMDD/HHz directories
##
## Forecast hours: F00-F18 (updated hourly)
##
# =============================================================================
# LAMP — Localized Aviation MOS Program
# =============================================================================
# Feedtype: NGRID
# WMO header: L[A-Z]UA[0-9][0-9] KMDL DDHHMM
# Product path: grib2/ncep/LAMP/#255/YYYYMMDDHHmmFhhh/VARIABLE/level
#
# Variables (NGRID feed):
#   TMPK  — 2m temperature (K)
#   DWPK  — 2m dewpoint (K)
#   SPED  — 10m wind speed (m/s)
#   DRCT  — 10m wind direction (deg)
#   GUST  — 10m wind gust (m/s)
#   VIS   — surface visibility (m)
#   CEIL  — ceiling (m)
#   CLD   — cloud cover category
#
# Pending HDS ALLOW from idd.aos.wisc.edu (requested 2026-04-12):
#   TSTM01, CTSTM01, CONVP01 — thunderstorm/convective probability
#   CEIL0304PB, CEIL0914PB, CEIL0152PB — ceiling probability bands
#   VIS1609PB, VIS4828PB, VIS8046PB — visibility probability bands
#
# File naming: /LDM/models/lamp/YYYYMMDD/lamp_YYYYMMDD_HHz_fFFF_VARIABLE.grib2
# Example:     /LDM/models/lamp/20260412/lamp_20260412_20z_f000_VIS.grib2
#
# Forecast horizon: F000-F025 (25 hours), hourly steps
# Cycle frequency:  Hourly (00Z-23Z)
# File size:        ~380KB-770KB per variable per hour
#
# After adding this rule:
#   ldmadmin pqactcheck -p /home/ldm/etc/pqact_ngrid.conf
#   systemctl restart ldm   (on data1 — NOT ldmadmin pqactHUP)
# =============================================================================

# LAMP NGRID — all 8 surface variables, all forecast hours
# Capture groups:
#   \1\2\3 = DDHHMM from WMO header (not used in filename)
#   \4\5\6 = YYYYMMDD from product path
#   \7\8   = HHMM from product path (cycle time)
#   \9     = FFF forecast hour (000-025)
#   \10    = VARIABLE name (VIS, CEIL, TMPK, etc.)
NGRID	^.*grib2/ncep/LAMP/#255/([0-9]{4})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})F([0-9]{3})/([A-Z0-9]+)/
	FILE	-close	/LDM/models/lamp/\1\2\3/lamp_\1\2\3_\4\5z_f\6_\7.grib2
