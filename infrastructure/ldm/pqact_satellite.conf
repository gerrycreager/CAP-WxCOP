##
## pqact_satellite.conf - GOES ABI CONUS Satellite Data
## Feedtype: SATELLITE
##

## GOES-18/19 CONUS — C02 (Visible), C08 (Water Vapor), C13 (IR Longwave)
## PIPE (not FILE) -close -- FILE -close showed ~43-67% HDF5 corruption on
## these products (2026-07-10 investigation), PIPE via satellite_pipe_writer.sh
## tested 32/32 clean at this same wildcarded pattern before being promoted here.
SATELLITE	^/data/cspp-geo/(GRB-R|WEST)/(OR_ABI-L1b-RadC-M6C(02|08|13)_G(1[89])_.+\.nc)$
	PIPE	-close	/home/ldm/scripts/satellite_pipe_writer.sh /LDM/satellite/goes\4/C\3/\2

## GOES-18/19 Full Disk — C08 (Water Vapor), C13 (IR) for AK/HI/PR-USVI (Guam pending)
## Same PIPE fix applied here -- RadF showed the same corruption pattern (in fact
## worse: ir_full_east was 100% failure in the 2026-07-10 backfill).
SATELLITE	^/data/cspp-geo/(GRB-R|WEST)/(OR_ABI-L1b-RadF-M6C(08|13)_G(1[89])_.+\.nc)$
	PIPE	-close	/home/ldm/scripts/satellite_pipe_writer.sh /LDM/satellite/goes\4/full/C\3/\2

## GLM Lightning — archive and ingest
SATELLITE	^/data/cspp-geo/GRB-R/(OR_GLM-L2-LCFA_G19_.*)
	FILE	-close	/LDM/satellite/GLM/EAST/\1
SATELLITE	^/data/cspp-geo/GRB-R/(OR_GLM-L2-LCFA_G19_.*)
	EXEC	/var/www/cap_winds_app/venv/bin/python3 /home/ldm/bin/ingest_glm_file.py /LDM/satellite/GLM/EAST/\1
SATELLITE	^/data/cspp-geo/WEST/(OR_GLM-L2-LCFA_G18_.*)
	FILE	-close	/LDM/satellite/GLM/WEST/\1
SATELLITE	^/data/cspp-geo/WEST/(OR_GLM-L2-LCFA_G18_.*)
	EXEC	/var/www/cap_winds_app/venv/bin/python3 /home/ldm/bin/ingest_glm_file.py /LDM/satellite/GLM/WEST/\1
