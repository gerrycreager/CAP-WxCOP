##
## pqact_satellite.conf - GOES-East and GOES-West Satellite Data
## Feedtype: SATELLITE
##
## Filename format
## /data/cspp-geo/WEST/OR_ABI-L1b-RadM1-M6C02_G18_s20260072039252_e20260072039310_c20260072039336.nc

# GOES-16 (GOES-East) - All products
SATELLITE	^GOES16
	FILE	-close	/LDM/satellite/goes16/\(yyyy)\(mm)\(dd)/\(hhnn).grib2

# GOES-18 (GOES-West) - All products
SATELLITE	^GOES18
	FILE	-close	/LDM/satellite/goes18/\(yyyy)\(mm)\(dd)/\(hhnn).grib2

# GOES-16 ABI (Advanced Baseline Imager) specific channels
# Full Disk imagery
SATELLITE	^GOES16.*ABI-L2-FDCC
	FILE	-close	/LDM/satellite/goes16/conus/\(yyyy)\(mm)\(dd)/\(hhnn)_conus.grib2

# CONUS imagery
SATELLITE	^GOES16.*CONUS
	FILE	-close	/LDM/satellite/goes16/conus/\(yyyy)\(mm)\(dd)/\(hhnn)_conus.grib2

# Mesoscale sector 1
SATELLITE	^GOES16.*MESO1
	FILE	-close	/LDM/satellite/goes16/meso1/\(yyyy)\(mm)\(dd)/\(hhnn)_meso1.grib2

# Mesoscale sector 2
SATELLITE	^GOES16.*MESO2
	FILE	-close	/LDM/satellite/goes16/meso2/\(yyyy)\(mm)\(dd)/\(hhnn)_meso2.grib2

# GOES-18 CONUS imagery
SATELLITE	^GOES18.*CONUS
	FILE	-close	/LDM/satellite/goes18/conus/\(yyyy)\(mm)\(dd)/\(hhnn)_conus.grib2

# GOES-18 Mesoscale sectors
SATELLITE	^GOES18.*MESO1
	FILE	-close	/LDM/satellite/goes18/meso1/\(yyyy)\(mm)\(dd)/\(hhnn)_meso1.grib2

SATELLITE	^GOES18.*MESO2
	FILE	-close	/LDM/satellite/goes18/meso2/\(yyyy)\(mm)\(dd)/\(hhnn)_meso2.grib2

#GLM data
DIFAX	^/data/cspp-geo/GRB-R/(OR_GLM-L2-LCFA_G19_.*)
	FILE	-close	/LDM/satellite/GLM/EAST/\1


DIFAX	^/data/cspp-geo/WEST/(OR_GLM-L2-LCFA_G18_.*)
	FILE	-close	/LDM/satellite/GLM/WEST/\1
