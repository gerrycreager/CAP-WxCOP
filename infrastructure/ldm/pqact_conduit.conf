##
## pqact_conduit.conf - GFS, AIGFS, AIGEFS, HGEFS Model Data
## Feedtype: CONDUIT
## Output: GRIB2 format
## Deploy to: data1:/home/ldm/etc/pqact_conduit.conf
## After deploy: ldmadmin pqactcheck /home/ldm/etc/pqact_conduit.conf
##               ldmadmin pqactHUP
##
## NOTE: All fields separated by TABs, not spaces.
##
## ============================================================================
## GFS
## ============================================================================
##
## Product ID example:
##   data/nccf/com/gfs/v16.3/gfs.20260101/12/atmos/gfs.t12z.pgrb2.0p25.f111
##
## Output: /LDM/models/gfs/0p25/YYYYMMDD/gfs_0p25_YYYYMMDD_HHz_fFFF.grib2
##
## Cycles: 00z, 06z, 12z, 18z  |  Resolution: 0.25 deg
## Forecast hours: f000-f384 (3-hourly)
## Availability: ~3.5 hours after cycle time
## CAP Winds uses: f000-f024 (CONUS), full range (OCONUS)
##
## Capture groups: \1=YYYYMMDD  \2=dir_hour(unused)  \3=cycle_hour  \4=fcst_hour
##

# GFS 0.25 degree global - all forecast hours
CONDUIT	^data/nccf/com/gfs/v[0-9]+\.[0-9]+/gfs\.([0-9]{8})/([0-2][0-9])/atmos/gfs\.t([0-2][0-9])z\.pgrb2\.0p25\.f([0-9]{3})
	FILE	-close	/LDM/models/gfs/0p25/\1/gfs_0p25_\1_\3z_f\4.grib2

# GFS CONUS 0.25 degree subset - smaller files for CONUS-only ingest path
CONDUIT	^data/nccf/com/gfs/v[0-9]+\.[0-9]+/gfs\.([0-9]{8})/([0-2][0-9])/atmos/gfs\.t([0-2][0-9])z\.pgrb2\.0p25\.conus\.f([0-9]{3})
	FILE	-close	/LDM/models/gfs/0p25_conus/\1/gfs_0p25_conus_\1_\3z_f\4.grib2

# GFS wave data (uncomment if needed)
#CONDUIT	^data/nccf/com/gfs/v[0-9]+\.[0-9]+/gfs\.([0-9]{8})/([0-2][0-9])/wave/gridded/gfswave\.t([0-2][0-9])z\..*\.f([0-9]{3})\.grib2
#	FILE	-close	/LDM/models/gfs/wave/\1/gfswave_\1_\3z_f\4.grib2


## ============================================================================
## AIGFS - AI Global Forecast System
## ============================================================================
##
## Product ID examples:
##   data/nccf/com/aigfs/v1.0/aigfs.20260323/18/model/atmos/grib2/aigfs.t18z.sfc.f000.grib2
##   data/nccf/com/aigfs/v1.0/aigfs.20260323/18/model/atmos/grib2/aigfs.t18z.pres.f000.grib2
##
## Surface fields per forecast hour (4 messages):
##   PRMSL, TMP/2m, UGRD/10m, VGRD/10m
## Pressure level fields per forecast hour (~78 messages, 13 levels):
##   HGT, TMP, SPFH, UGRD, VGRD, VVEL at 50/100/150/200/250/300/400/500/600/700/850/925/1000 hPa
##
## Output sfc : /LDM/models/AIGFS/AIGFS_YYYYMMDD_HH00_sfc.grib2  (~250 MB/cycle)
## Output pres: /LDM/models/AIGFS/AIGFS_YYYYMMDD_HH00_pres.grib2 (~4.8 GB/cycle)
##
## Cycles: 00z, 06z, 12z, 18z  |  Resolution: 0.25 deg global
## Forecast hours: 0,6,12,...,384 (6-hourly, 65 steps)
## Availability: 3-4 hours after cycle time, ~40 min transfer
## ingest_model_winds.py uses: sfc file only (10m U/V winds)
## Future use: pres file for ceiling/vis/upper-air
##
## Capture groups: \1=YYYYMMDD  \2=cycle_hour
## NOTE: sfc and pres patterns are mutually exclusive via filename match.
##       -close causes LDM to close+reopen output file after each appended
##       message (~260 sfc messages over 40 min = negligible syscall overhead).
##

# AIGFS surface fields (PRMSL, TMP/2m, UGRD/10m, VGRD/10m) - used by wind ingest
#CONDUIT	^data/nccf/com/aigfs/.*/aigfs\.([0-9]{8})/([0-2][0-9])/model/atmos/grib2/aigfs\.t[0-2][0-9]z\.sfc\.f(0[00-48])
#	FILE	-close	/LDM/models/AIGFS/AIGFS_\1_\200_sfc.grib2
CONDUIT	^data/nccf/com/aigfs/v[0-9]+\.[0-9]+/aigfs\.([0-9]{8})/([0-2][0-9])/model/atmos/grib2/aigfs\.t[0-2][0-9]z\.sfc\.f(000|006|012|018|024|030|036|042|048)\.grib2
	FILE	-close	/LDM/models/AIGFS/AIGFS_\1_\200_sfc.grib2

# AIGFS pressure level fields - preserved for future ceiling/vis/upper-air use
#CONDUIT	^data/nccf/com/aigfs/.*/aigfs\.([0-9]{8})/([0-2][0-9])/model/atmos/grib2/aigfs\.t[0-2][0-9]z\.pres\.f(0[00-48])
#	FILE	-close	/LDM/models/AIGFS/AIGFS_\1_\200_pres.grib2
CONDUIT	^data/nccf/com/aigfs/v[0-9]+\.[0-9]+/aigfs\.([0-9]{8})/([0-2][0-9])/model/atmos/grib2/aigfs\.t[0-2][0-9]z\.pres\.f(000|006|012|018|024|030|036|042|048)\.grib2
	FILE	-close	/LDM/models/AIGFS/AIGFS_\1_\200_pres.grib2

## ============================================================================
## AIGEFS - AI Global Ensemble Forecast System
## ============================================================================
##
## Product ID examples:
##   data/nccf/com/aigefs/v1.0/aigefs.20260323/18/ensstat/products/atmos/grib2/aigefs.t18z.sfc.avg.f000.grib2
##   data/nccf/com/aigefs/v1.0/aigefs.20260323/18/ensstat/products/atmos/grib2/aigefs.t18z.pres.avg.f000.grib2
##   data/nccf/com/aigefs/v1.0/aigefs.20260323/18/ensstat/products/atmos/grib2/aigefs.t18z.pres.spr.f000.grib2
##
## avg = ensemble mean fields  |  spr = ensemble spread fields
## Surface fields: UGRD/10m, VGRD/10m, TMP/2m (mean and spread)
## Pressure fields: HGT, TMP, SPFH, UGRD, VGRD, VVEL at 13 levels (mean and spread)
##
## Output sfc avg : /LDM/models/AIGEFS/AIGEFS_YYYYMMDD_HH00_sfc_avg.grib2
## Output sfc spr : /LDM/models/AIGEFS/AIGEFS_YYYYMMDD_HH00_sfc_spr.grib2
## Output pres avg: /LDM/models/AIGEFS/AIGEFS_YYYYMMDD_HH00_pres_avg.grib2
## Output pres spr: /LDM/models/AIGEFS/AIGEFS_YYYYMMDD_HH00_pres_spr.grib2
##
## Cycles: 00z, 06z, 12z, 18z  |  Resolution: 0.25 deg global
## Forecast hours: 0,6,12,...,384 (6-hourly)
## Availability: 3-4 hours after cycle time
## Full dataset: ~7.7 GB/cycle (avg+spr combined)
##

# AIGEFS surface ensemble mean - used by probabilistic wind ingest
CONDUIT	^data/nccf/com/aigefs/.*/aigefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/aigefs\.t[0-2][0-9]z\.sfc\.avg\.f
	FILE	-close	/LDM/models/AIGEFS/AIGEFS_\1_\200_sfc_avg.grib2

# AIGEFS surface ensemble spread - wind uncertainty
CONDUIT	^data/nccf/com/aigefs/.*/aigefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/aigefs\.t[0-2][0-9]z\.sfc\.spr\.f
	FILE	-close	/LDM/models/AIGEFS/AIGEFS_\1_\200_sfc_spr.grib2

# AIGEFS pressure level ensemble mean - future ceiling/vis/upper-air use
CONDUIT	^data/nccf/com/aigefs/.*/aigefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/aigefs\.t[0-2][0-9]z\.pres\.avg\.f
	FILE	-close	/LDM/models/AIGEFS/AIGEFS_\1_\200_pres_avg.grib2

# AIGEFS pressure level ensemble spread - future use
CONDUIT	^data/nccf/com/aigefs/.*/aigefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/aigefs\.t[0-2][0-9]z\.pres\.spr\.f
	FILE	-close	/LDM/models/AIGEFS/AIGEFS_\1_\200_pres_spr.grib2


## ============================================================================
## HGEFS - Hybrid Global Ensemble Forecast System
## ============================================================================
##
## Product ID example:
##   data/nccf/com/hgefs/v1.0/hgefs.20260323/18/ensstat/products/atmos/grib2/hgefs.t18z.sfc.avg.f000.grib2
##
## 62-member grand ensemble (31 GEFS + 31 AIGEFS members)
## Same variable structure as AIGEFS (avg + spr, sfc + pres)
## Dataset size: ~5.4 GB/cycle
## Availability: 6-7 hours after cycle time (latest of the three)
##
## Output sfc avg : /LDM/models/HGEFS/HGEFS_YYYYMMDD_HH00_sfc_avg.grib2
## Output sfc spr : /LDM/models/HGEFS/HGEFS_YYYYMMDD_HH00_sfc_spr.grib2
## Output pres avg: /LDM/models/HGEFS/HGEFS_YYYYMMDD_HH00_pres_avg.grib2
## Output pres spr: /LDM/models/HGEFS/HGEFS_YYYYMMDD_HH00_pres_spr.grib2
##

# HGEFS surface ensemble mean
CONDUIT	^data/nccf/com/hgefs/.*/hgefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/hgefs\.t[0-2][0-9]z\.sfc\.avg\.f
	FILE	-close	/LDM/models/HGEFS/HGEFS_\1_\200_sfc_avg.grib2

# HGEFS surface ensemble spread
CONDUIT	^data/nccf/com/hgefs/.*/hgefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/hgefs\.t[0-2][0-9]z\.sfc\.spr\.f
	FILE	-close	/LDM/models/HGEFS/HGEFS_\1_\200_sfc_spr.grib2

# HGEFS pressure level ensemble mean - future use
CONDUIT	^data/nccf/com/hgefs/.*/hgefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/hgefs\.t[0-2][0-9]z\.pres\.avg\.f
	FILE	-close	/LDM/models/HGEFS/HGEFS_\1_\200_pres_avg.grib2

# HGEFS pressure level ensemble spread - future use
CONDUIT	^data/nccf/com/hgefs/.*/hgefs\.([0-9]{8})/([0-2][0-9])/ensstat/products/atmos/grib2/hgefs\.t[0-2][0-9]z\.pres\.spr\.f
	FILE	-close	/LDM/models/HGEFS/HGEFS_\1_\200_pres_spr.grib2


##
