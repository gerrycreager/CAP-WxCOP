##
## pqact_conduit.conf - GFS Model Data
## Feedtype: CONDUIT
## Output: GRIB2 format
##
## Sample product ID:
##  data/nccf/com/gfs/v16.3/gfs.20260101/12/atmos/gfs.t12z.pgrb2.0p25.f111
##
## Directory Structure: /LDM/models/gfs/0p25/YYYYMMDD/gfs_0p25_YYYYMMDD_HHz_fFFF.grib2
## Example: /LDM/models/gfs/0p25/20260102/gfs_0p25_20260102_18z_f000.grib2
##

# GFS 0.25 degree global - All forecast hours
# Used for: Alaska, Hawaii, Puerto Rico, Caribbean, and global coverage
# Pattern captures: \1=YYYYMMDD, \2=dir_hour, \3=cycle_hour, \4=fcst_hour
CONDUIT	^data/nccf/com/gfs/v[0-9]+\.[0-9]+/gfs\.([0-9]{8})/([0-2][0-9])/atmos/gfs\.t([0-2][0-9])z\.pgrb2\.0p25\.f([0-9]{3})
	FILE	-close	/LDM/models/gfs/0p25/\1/gfs_0p25_\1_\3z_f\4.grib2

# GFS CONUS 0.25 degree subset (optional - smaller files)
# Smaller files, faster download for CONUS-only applications
CONDUIT	^data/nccf/com/gfs/v[0-9]+\.[0-9]+/gfs\.([0-9]{8})/([0-2][0-9])/atmos/gfs\.t([0-2][0-9])z\.pgrb2\.0p25\.conus\.f([0-9]{3})
	FILE	-close	/LDM/models/gfs/0p25_conus/\1/gfs_0p25_conus_\1_\3z_f\4.grib2

# GFS wave data (optional - uncomment if needed)
#CONDUIT	^data/nccf/com/gfs/v[0-9]+\.[0-9]+/gfs\.([0-9]{8})/([0-2][0-9])/wave/gridded/gfswave\.t([0-2][0-9])z\..*\.f([0-9]{3})\.grib2
#	FILE	-close	/LDM/models/gfs/wave/\1/gfswave_\1_\3z_f\4.grib2

##
## GFS Model Information:
## - Cycles: 00z, 06z, 12z, 18z (every 6 hours)
## - Resolution: 0.25° (~27 km at equator)
## - Forecast hours: 
##   * 0-120: Every 3 hours (f000, f003, f006, ..., f120)
##   * 123-384: Every 3 hours (extended range)
## - CAP Winds uses: f000-f012 (first 12 hours, 3-hourly)
## - Full cycle availability: ~3-4 hours after model run time
##
## Data Retention Recommendation:
## - Keep 2-3 days of data: ~20 GB per day
## - Cleanup command: find /LDM/models/gfs -name "*.grib2" -mtime +3 -delete
##
## Troubleshooting:
## - Check feed: ldmadmin watch | grep CONDUIT
## - Check pqact syntax: ldmadmin pqactcheck /usr/local/ldm/etc/pqact_conduit.conf
## - Reload config: ldmadmin pqactHUP
## - Monitor directory: watch -n 30 'ls -lh /LDM/models/gfs/0p25/$(date -u +%Y%m%d)/'
##
