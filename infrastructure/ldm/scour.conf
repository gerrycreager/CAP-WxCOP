# Configuration file for "scour" utility, to delete all files older than a
# specified number of days from specified directories and all their
# subdirectories.  Scour should be invoked periodically by cron(8).
#
# Each line consists of a directory, a retention time (in days), and
# (optionally) a shell filename pattern for files to be deleted.  If no
# filename pattern is specified, "*" representing all files not beginning with
# "." is assumed.  The syntax "~user" is understood.  Non-absolute pathnames
# are relative to the directory `regutil /pqact/datadir-path`.
#
# A hash in column one indicates a comment line.
#
# This is data1's live config -- the host that actually owns /LDM's physical
# storage and runs scour.py via cron (6 */3 * * *). r815 also has a copy of
# this file, but its own scour cron entries are commented out (both
# `ldmadmin scour` and `scour.py`) -- it's an inert leftover from before /LDM
# was migrated to NFS-mounted-from-data1, and was never kept in sync with
# this one. Treat data1's config as authoritative.

# Directory			Days-old	Optional-filename-pattern

#dir1		            2
#dir2			        2		*.foo
/LDM			7
/LDM/text/metar		3
/LDM/radar/level3	2
/LDM/radar/level2	1
/LDM/text/taf		3
/LDM/text/warnings	2
/LDM/text/watches	2
/LDM/text/afd		14
#/var/www/cap_winds_app/model_data	1
#/var/www/cap_winds_app/model_data	2	gfs.202*
/LDM/fire		5
/LDM/satellite 		3
/home/ldm/var/logs	7
/LDM/WWA		5

# Models - general retention (covers hrrr, gfs per-forecast-hour files, etc.)
/LDM/models		3

# AI model files are large (5-8 GB/cycle, 4 cycles/day).
# 1.5 days (36 hours) keeps current + previous cycle with margin.
# Subdirectory entries override the parent /LDM/models rule above.
/LDM/models/AIGFS	2	*.grib2
/LDM/models/AIGEFS	2	*.grib2
/LDM/models/HGEFS	2	*.grib2

# GFS/HRRR: extended retention for backtesting/verification (14 days each).
# Plenty of headroom -- HRRR ~45GB/day, GFS ~1GB/day, 4.6TB free on /data
# as of 2026-09-12. Subdirectory entries override the parent rule above.
/LDM/models/gfs		14	*.grib2
/LDM/models/hrrr	14	*.grib2
