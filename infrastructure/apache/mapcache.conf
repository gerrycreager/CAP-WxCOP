# Tile cache fronting the MRMS/satellite WMS backends (mrms_wms_api.py,
# satellite_wms_api.py). See /etc/mapcache.xml.
<IfModule mapcache_module>
    MapCacheAlias /mapcache "/etc/mapcache.xml"
</IfModule>

# CORS: AvTrack (served on its own origin, port 2468) fetches sectional_vfr
# tiles from this endpoint via an absolute https://wxcop.duckdns.org/mapcache/...
# URL, not a relative path (see frontend/src/main.js BASEMAPS.sectional comment),
# so it's cross-origin. MapLibre GL loads raster tiles with fetch(), which
# enforces CORS -- unlike Leaflet's plain <img> tags (used by EWMC/Flight Ops
# Impacts), which don't need it. Without this header every tile request failed
# silently (net::ERR_FAILED in the browser), leaving the sectional basemap blank
# in AvTrack even though the tiles themselves rendered fine (found live 2026-11-23,
# Gerry: "when I select VFR Sectional, I see no background"). Public read-only
# tile images, so "*" is fine.
<Location /mapcache>
    Header set Access-Control-Allow-Origin "*"
</Location>
