<VirtualHost *:8080>
    # ── MapServer CGI — MRMS local products ─────────────────────────────────
    ScriptAlias /wms/mrms_composite         /usr/bin/mapserv
    ScriptAlias /wms/mrms_azshear_low       /usr/bin/mapserv
    ScriptAlias /wms/mrms_mesh              /usr/bin/mapserv
    ScriptAlias /wms/mrms_composite_alaska  /usr/bin/mapserv
    ScriptAlias /wms/mrms_composite_hawaii  /usr/bin/mapserv
    ScriptAlias /wms/mrms_composite_carib   /usr/bin/mapserv
    ScriptAlias /wms/mrms_composite_guam    /usr/bin/mapserv
    ScriptAlias /wms/sectional_vfr          /usr/bin/mapserv

    <Directory /usr/bin>
        <Files mapserv>
            Require all granted
        </Files>
    </Directory>

    <Location /wms/mrms_composite>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_composite.map
    </Location>
    <Location /wms/mrms_azshear_low>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_azshear_low.map
    </Location>
    <Location /wms/mrms_mesh>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_mesh.map
    </Location>
    <Location /wms/mrms_composite_alaska>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_composite_alaska.map
    </Location>
    <Location /wms/mrms_composite_hawaii>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_composite_hawaii.map
    </Location>
    <Location /wms/mrms_composite_carib>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_composite_carib.map
    </Location>
    <Location /wms/mrms_composite_guam>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/mrms_composite_guam.map
    </Location>

    # Static FAA VFR Sectional raster: no per-request ts/mapfile
    # substitution needed (unlike MRMS above), so served directly via
    # a fixed mapfile rather than through a Flask WMS wrapper.
    # Credit: Charlie Jackson/capgrids.com, see
    # /var/www/cap_winds_app/data/sectionals/README.md
    <Location /wms/sectional_vfr>
        SetHandler cgi-script
        Options +ExecCGI
        SetEnv MAPSERVER_CONFIG_FILE /var/www/mapserver/mapserver.conf
        SetEnv MS_MAPFILE /var/www/mapserver/mapfiles/sectional_vfr.map
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/mapserver_error.log
    CustomLog ${APACHE_LOG_DIR}/mapserver_access.log combined
</VirtualHost>
