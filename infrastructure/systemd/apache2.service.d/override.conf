# Hardening added 2026-09-19 after apache2 sat in `failed` state for ~19h
# following r815's 2026-09-18 07:00 UTC daily reboot -- a systemd startup
# *timeout* (not a crash/config error; apachectl configtest passed clean
# afterward), most likely apache2 outracing the /LDM NFS mount from data1
# coming up. The vendor unit only had Restart=on-abort, which does NOT
# cover a timeout-kill, so nothing ever retried it -- it just stayed dead
# until someone happened to notice.
#
# Restart=on-failure covers timeout-kills (and non-zero exits, signals)
# without fighting a deliberate `systemctl stop`. TimeoutStartSec doubled
# to give a slow NFS mount more room before being treated as a genuine
# hang. RestartSec gives a brief pause before retrying rather than
# hammering immediately if the underlying cause hasn't cleared yet.
[Service]
Restart=on-failure
RestartSec=10s
TimeoutStartSec=180s
