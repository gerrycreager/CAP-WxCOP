# ── WSGI Daemon Processes — server level, accessible from all VirtualHosts ──
# Must be outside any VirtualHost block
WSGIDaemonProcess CAP_WxCOP \
    socket-timeout=60 \
    user=www-data \
    group=www-data \
    python-home=/var/www/cap_winds_app/venv \
    python-path=/var/www/cap_winds_app \
    processes=1 \
    threads=15 \
    maximum-requests=1000

WSGIDaemonProcess CAP_WxCOP_DEV \
    socket-timeout=60 \
    user=www-data \
    group=www-data \
    python-home=/var/www/cap_winds_dev/venv \
    python-path=/var/www/cap_winds_dev \
    processes=1 \
    threads=5

ServerName wxcop.duckdns.org

<VirtualHost *:80>
    ServerName wxcop.duckdns.org
    ServerAlias 209.248.90.253 localhost 127.0.0.1
    DocumentRoot /var/www/html
    RedirectMatch ^/$ /CAP_WxCOP/

    # ── Script aliases — more specific path first ───────────────────
    Alias /favicon.ico /var/www/cap_winds_app/static/favicon.ico
    WSGIScriptAlias /CAP_WxCOP_DEV /var/www/cap_winds_dev/cap_winds.wsgi
    WSGIScriptAlias /CAP_WxCOP     /var/www/cap_winds_app/cap_winds.wsgi

    Alias /CAP_WxCOP/static/radar/mosaic /LDM/radar/mosaic
    <Directory /LDM/radar/mosaic>
        Require all granted
        Options -Indexes
    </Directory>

    # ── Production app directory ────────────────────────────────────
    <Directory /var/www/cap_winds_app>
        WSGIProcessGroup CAP_WxCOP
        WSGIApplicationGroup %{RESOURCE}
        Require all granted

        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # ── Dev app directory ───────────────────────────────────────────
    <Directory /var/www/cap_winds_dev>
        WSGIProcessGroup CAP_WxCOP_DEV
        WSGIApplicationGroup %{RESOURCE}
        Require all granted

        Header always set X-Environment "DEVELOPMENT"
    </Directory>

    # ── MRMS radar tiles (served from LDM data dir, not app dir) ───
    # More specific alias must come before /CAP_WxCOP/static
    Alias /CAP_WxCOP/static/mrms_tiles /LDM/radar/mrms_tiles
    <Directory /LDM/radar/mrms_tiles>
        Require all granted
        Options -Indexes -FollowSymLinks
        AllowOverride None

        # Short cache: tiles update every 2 minutes
        ExpiresActive On
        ExpiresByType image/png "access plus 2 minutes"
        ExpiresByType application/json "access plus 30 seconds"
    </Directory>


    # TSTM probability tiles (LAMP CTSTM01, rendered by tstm_tile_renderer.py)
    Alias /tstm/tiles /LDM/tstm_tiles/latest
    <Directory /LDM/tstm_tiles>
        Require all granted
        Options FollowSymLinks
        AllowOverride None
        ExpiresActive On
        ExpiresByType image/png "access plus 5 minutes"
        ExpiresByType application/json "access plus 60 seconds"
    </Directory>
    # MRMS latest composite tiles (symlink-based, for weather map overlay)
    Alias /mrms/composite/conus /LDM/radar/mrms_tiles/composite/CONUS/latest
    <Directory /LDM/radar/mrms_tiles/composite/CONUS>
    	Require all granted
    	Options FollowSymLinks
    </Directory>

    # ── Production static files ─────────────────────────────────────
    Alias /CAP_WxCOP/static /var/www/cap_winds_app/static
    <Directory /var/www/cap_winds_app/static>
        Require all granted

        ExpiresActive On
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType application/json "access plus 1 hour"

        <IfModule mod_deflate.c>
            SetOutputFilter DEFLATE
            SetEnvIfNoCase Request_URI \
                \.(?:gif|jpe?g|png)$ no-gzip dont-vary
            SetEnvIfNoCase Request_URI \
                \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        </IfModule>
        <FilesMatch "sw\.js$">
            Header set Service-Worker-Allowed "/CAP_WxCOP/"
        </FilesMatch>
    </Directory>

    # ── Production batch maps ───────────────────────────────────────
    Alias /CAP_WxCOP/batch_maps /var/www/cap_winds_app/static/batch_maps
    <Directory /var/www/cap_winds_app/static/batch_maps>
        Require all granted
        Options -Indexes

        ExpiresActive On
        ExpiresDefault "access plus 15 minutes"

        <FilesMatch "\.(py|php|pl|cgi|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # ── Dev static files ────────────────────────────────────────────
    # More specific alias must come before /CAP_WxCOP_DEV/static
    Alias /CAP_WxCOP_DEV/static/mrms_tiles /LDM/radar/mrms_tiles
    Alias /CAP_WxCOP_DEV/static /var/www/cap_winds_dev/static
    <Directory /var/www/cap_winds_dev/static>
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 minute"
    </Directory>

    # ── Logging ─────────────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/cap_winds_error.log
    CustomLog ${APACHE_LOG_DIR}/cap_winds_access.log combined
    LogLevel warn

    # ── Misc ────────────────────────────────────────────────────────
    RedirectPermanent /cap_winds_app /CAP_WxCOP

</VirtualHost>

<VirtualHost *:443>
    ServerName wxcop.duckdns.org
    RedirectMatch ^/$ /CAP_WxCOP/
    # TSTM probability tiles (LAMP CTSTM01, rendered by tstm_tile_renderer.py)
    Alias /tstm/tiles /LDM/tstm_tiles/latest
    <Directory /LDM/tstm_tiles>
        Require all granted
        Options FollowSymLinks
        AllowOverride None
        ExpiresActive On
        ExpiresByType image/png "access plus 5 minutes"
        ExpiresByType application/json "access plus 60 seconds"
    </Directory>

    ServerAlias 209.248.90.253

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/wxcop.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wxcop.duckdns.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ── Script aliases — more specific path first ───────────────────
    Alias /favicon.ico /var/www/cap_winds_app/static/favicon.ico
    WSGIScriptAlias /CAP_WxCOP_DEV /var/www/cap_winds_dev/cap_winds.wsgi
    WSGIScriptAlias /CAP_WxCOP     /var/www/cap_winds_app/cap_winds.wsgi

    # ── Production app directory ────────────────────────────────────
    <Directory /var/www/cap_winds_app>
        WSGIProcessGroup CAP_WxCOP
        WSGIApplicationGroup %{RESOURCE}
        Require all granted

        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # ── Dev app directory ───────────────────────────────────────────
    <Directory /var/www/cap_winds_dev>
        WSGIProcessGroup CAP_WxCOP_DEV
        WSGIApplicationGroup %{RESOURCE}
        Require all granted

        Header always set X-Environment "DEVELOPMENT"
    </Directory>

    # ── MRMS radar tiles ────────────────────────────────────────────
    Alias /CAP_WxCOP/static/mrms_tiles /LDM/radar/mrms_tiles
    Alias /CAP_WxCOP_DEV/static/mrms_tiles /LDM/radar/mrms_tiles
    <Directory /LDM/radar/mrms_tiles>
        Require all granted
        Options -Indexes -FollowSymLinks
        AllowOverride None
        ExpiresActive On
        ExpiresByType image/png "access plus 2 minutes"
        ExpiresByType application/json "access plus 30 seconds"

    # MRMS latest composite tiles (symlink-based, for weather map overlay)
    </Directory>
    Alias /mrms/composite/conus /LDM/radar/mrms_tiles/composite/CONUS/latest
    <Directory /LDM/radar/mrms_tiles/composite/CONUS>
	Require all granted
    	Options FollowSymLinks
    </Directory>

    # ── Static files ────────────────────────────────────────────────
    Alias /CAP_WxCOP/static     /var/www/cap_winds_app/static
    Alias /CAP_WxCOP_DEV/static /var/www/cap_winds_dev/static

    <Directory /var/www/cap_winds_app/static>
        Require all granted
        ExpiresActive On
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType application/json "access plus 1 hour"
        <FilesMatch "sw\.js$">
            Header set Service-Worker-Allowed "/CAP_WxCOP/"
        </FilesMatch>
    </Directory>
    <Directory /var/www/cap_winds_dev/static>
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 minute"
    </Directory>

    # ── Logging ─────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/cap-wxcop-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/cap-wxcop-ssl-access.log combined
    LogLevel warn

</VirtualHost>
