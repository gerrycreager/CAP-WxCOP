# pqact_mrms.conf — CONUS MRMS tile rendering for data1
# Last modified: 2026-03-22
#
# Handles: CONUS only — OCONUS moved to data2/pqact_mrms_oconus.conf
# Products: MergedReflectivityQComposite, MESH, MESH_Max,
#           LightningProbability, MergedAzShear
#
# Product identifier format from feed:
#   MRMS_ProductName_HH.HH_YYYYMMDD-HHMMSS.grib2.gz
#
# Two actions per product:
#   FILE  - archives raw grib2.gz (uses \1 = full filename)
#   PIPE  - renders tiles; \1\2\3=YYYYMMDD  \4\5\6=HHMMSS
#
# After any edit:
#   ldmadmin pqactcheck -p /home/ldm/etc/pqact_mrms_conus.conf
#   ldmadmin pqactHUP

# =============================================================================
# CONUS PRODUCTS
# =============================================================================

# -- CONUS Composite Reflectivity ---------------------------------------------
EXP	(MRMS_MergedReflectivityQComposite_[^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Composite/\1
EXP	MRMS_MergedReflectivityQComposite_[0-9.]+_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])-([0-9][0-9])([0-9][0-9])([0-9][0-9])\.grib2\.gz$
	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh composite CONUS \1\2\3 \4\5\6

# -- CONUS Reflectivity at Lowest Altitude (RALA — uncomment when confirmed) --
#EXP	(MRMS_ReflectivityAtLowestAltitude_[^/]+\.grib2\.gz)$
#	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Composite/\1
#EXP	MRMS_ReflectivityAtLowestAltitude_[0-9.]+_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])-([0-9][0-9])([0-9][0-9])([0-9][0-9])\.grib2\.gz$
#	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh rala CONUS \1\2\3 \4\5\6

# -- CONUS MESH (instantaneous) -----------------------------------------------
EXP	(MRMS_MESH_[0-9][^/]+\.grib2\.gz)$
	FILE	-close	/LDM/radar/mrms/%Y/%m/%d/Severe/\1
EXP	MRMS_MESH_[0-9.]+_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])-([0-9][0-9])([0-9][0-9])([0-9][0-9])\.grib2\.gz$
	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh mesh CONUS \1\2\3 \4\5\6

