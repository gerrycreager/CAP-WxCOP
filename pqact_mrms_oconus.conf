# pqact_mrms_oconus.conf — OCONUS MRMS tile rendering for data2
# Last modified: 2026-03-22
#
# Handles: ALASKA, HAWAII, CARIB, GUAM
# Products: LayerCompositeReflectivity_Super, MESH, MESH_Max,
#           MergedAzShear (v12 — new for OCONUS), LightningProbability (v12 — new for OCONUS)
#
# NOTE: FILE archiving is handled exclusively by data1's pqact_mrms.conf.
#       data2 only renders tiles — PIPE actions only, no FILE actions.
#       data2 writes tiles to /LDM/radar/mrms_tiles/ via rw NFS mount from data1.
#
# Product identifier format from feed:
#   /SECTOR/MRMS_ProductName_HH.HH_YYYYMMDD-HHMMSS.grib2.gz
#
# PIPE actions: ␁␂␃=YYYYMMDD  ␄␅␆=HHMMSS
#   → mrms_render_pipe.sh <product> <sector> <YYYYMMDD> <HHMMSS>
#
# After any edit:
#   ldmadmin pqactcheck -p /home/ldm/etc/pqact_mrms.conf
#   ldmadmin pqactHUP
EXP	/ALASKA/MRMS_LayerCompositeReflectivity_Super_[0-9.]+_([0-9][0-9][0-9][0-9])([0-9][0-9])([0-9][0-9])-([0-9][0-9])([0-9][0-9])([0-9][0-9])\.grib2\.gz$
	PIPE	-close	/home/ldm/scripts/mrms_render_pipe.sh composite ALASKA \1\2\3 \4\5\6

